<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Løfteudstyr</title>
<meta name="theme-color" content="#11140f">
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<link rel="icon" href="./icons/favicon-32.png" sizes="32x32">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
:root{
  --bg:#11140f; --panel:#191d15; --panel2:#20261c; --line:#2e372a;
  --ink:#e8ede4; --dim:#93a08c; --faint:#68755f;
  --teal:#5fb8a6; --lime:#c9d65a; --amber:#e0a33c; --red:#d9534a;
  --ok:#5fb8a6;
  --tap:58px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:Archivo,system-ui,sans-serif; font-size:16px; line-height:1.45;
  padding-bottom:env(safe-area-inset-bottom);
  overscroll-behavior-y:contain;
}
button,input,select,textarea{font:inherit;color:inherit}
.mono{font-family:'Space Mono',ui-monospace,monospace}

/* ---------- ramme ---------- */
header{
  position:sticky;top:0;z-index:20;background:var(--bg);
  border-bottom:1px solid var(--line);
  padding:calc(env(safe-area-inset-top) + 10px) 16px 10px;
  display:flex;align-items:center;gap:12px;min-height:56px;
}
/* Indholdet er 640 px bredt og centreret. Headeren og fanelinjen skal
   følge med, ellers står teksten i venstre kant på en bred skærm. */
header{padding-left:max(16px,calc(50vw - 320px));padding-right:max(16px,calc(50vw - 320px))}
#faner{padding-left:max(0px,calc(50vw - 320px));padding-right:max(0px,calc(50vw - 320px))}
#net,#demo{padding-left:max(16px,calc(50vw - 320px));padding-right:max(16px,calc(50vw - 320px))}
#toast{left:max(16px,calc(50vw - 320px));right:max(16px,calc(50vw - 320px))}
#btop,#brapport{margin-left:auto;margin-right:auto;max-width:640px}
header h1{font-size:17px;font-weight:600;margin:0;flex:1;min-width:0;letter-spacing:-.01em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header h1 .sub{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header .sub{font-size:12px;color:var(--dim);font-weight:400;display:block;margin-top:1px}
.iconbtn{
  background:none;border:1px solid var(--line);border-radius:10px;
  width:40px;height:40px;display:grid;place-items:center;flex:none;
  color:var(--dim);font-size:20px;cursor:pointer;
}
.iconbtn:active{background:var(--panel2)}
.iconbtn[hidden]{display:none}
main{padding:14px 16px 90px;max-width:640px;margin:0 auto}

/* ---------- net-status ---------- */
#net{
  display:none;padding:9px 16px;font-size:13px;font-weight:500;
  background:var(--amber);color:#1a1408;text-align:center;
}
#net.vis{display:block}
#net.sender{background:var(--teal);color:#08201c}

/* ---------- liste ---------- */
.rk{
  display:block;width:100%;text-align:left;background:var(--panel);
  border:1px solid var(--line);border-left:4px solid var(--line);
  border-radius:12px;padding:13px 14px;margin-bottom:9px;cursor:pointer;
}
.rk:active{background:var(--panel2)}
.rk.overskredet{border-left-color:var(--red)}
.rk.snart{border-left-color:var(--amber)}
.rk.ok{border-left-color:var(--teal)}
.rk.standset{border-left-color:var(--red);background:#241614}
.rk h3{margin:0 0 3px;font-size:16px;font-weight:600;letter-spacing:-.01em}
.rk .meta{font-size:12.5px;color:var(--dim);display:flex;flex-wrap:wrap;gap:4px 12px}
.termin{font-size:13px;margin-top:6px;font-weight:600}
.termin.overskredet{color:var(--red)}
.termin.snart{color:var(--amber)}
.termin.ok{color:var(--teal)}
.termin.standset{color:var(--red)}
.merker{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.mrk{
  font-size:11px;padding:3px 8px;border-radius:99px;
  background:var(--panel2);color:var(--dim);border:1px solid var(--line);
}
.mrk.fejl{background:#2d1917;color:#f0a49c;border-color:#4a2521}
.mrk.forb{background:#20261c;color:var(--lime);border-color:#39432b}

/* ---------- felter ---------- */
.sog{
  width:100%;background:var(--panel);border:1px solid var(--line);
  border-radius:12px;padding:14px;margin-bottom:14px;font-size:16px;
}
.sog:focus{outline:2px solid var(--teal);outline-offset:-1px}
h2.afsnit{
  font-size:13px;font-weight:600;color:var(--dim);margin:22px 0 9px;
  letter-spacing:.01em;
}
h2.afsnit:first-child{margin-top:2px}

/* ---------- kort ---------- */
.kort{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
.kort.rettbar:active{background:var(--panel2)}
.par{display:flex;justify-content:space-between;gap:14px;padding:7px 0;border-bottom:1px solid var(--line);font-size:14px}
.par:last-child{border-bottom:none}
.par dt{color:var(--dim);flex:none}
.par dd{margin:0;text-align:right;font-weight:500}

/* ---------- knapper ---------- */
.knap{
  display:block;width:100%;min-height:var(--tap);border-radius:12px;
  border:1px solid var(--line);background:var(--panel2);color:var(--ink);
  font-size:16px;font-weight:600;cursor:pointer;padding:14px;margin-bottom:10px;
}
.knap:active{transform:scale(.985)}
.knap.primaer{background:var(--teal);color:#08201c;border-color:var(--teal)}
.knap.fare{background:#2d1917;color:#f0a49c;border-color:#4a2521}
.knap:disabled{opacity:.4;cursor:not-allowed}

/* ---------- tjekliste ---------- */
.fremdrift{height:3px;background:var(--line);position:relative;margin:0 -16px 16px}
.fremdrift i{position:absolute;left:0;top:0;bottom:0;background:var(--lime);transition:width .25s}
.tael{font-size:12.5px;color:var(--dim);margin-bottom:12px;display:flex;justify-content:space-between}
.sektion{font-size:12.5px;color:var(--lime);margin-bottom:6px}
.sporgsmal{font-size:21px;line-height:1.3;font-weight:600;margin:0 0 14px;letter-spacing:-.015em}
.vejl{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:13px 14px;margin-bottom:11px;font-size:14.5px;color:#cfd8c8}
.vejl h4{margin:0 0 5px;font-size:12.5px;color:var(--dim);font-weight:600}
.vejl+.vejl{margin-top:-3px}
.svar{display:grid;grid-template-columns:1fr;gap:9px;margin:16px 0 12px}
.svar button{
  min-height:64px;border-radius:12px;font-size:17px;font-weight:700;
  border:2px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer;
  display:flex;align-items:center;gap:12px;padding:0 18px;
}
.svar button .dot{width:14px;height:14px;border-radius:50%;flex:none}
.svar button[data-v="OK"] .dot{background:var(--ok)}
.svar button[data-v="Bemærkning"] .dot{background:var(--amber)}
.svar button[data-v="Fejl"] .dot{background:var(--red)}
.svar button[data-v="Udbedret"] .dot{background:var(--lime)}
.svar button.valgt[data-v="Udbedret"]{border-color:var(--lime);background:#1e2410}
.svar button.valgt[data-v="OK"]{border-color:var(--ok);background:#10231f}
.svar button.valgt[data-v="Bemærkning"]{border-color:var(--amber);background:#241d0f}
.svar button.valgt[data-v="Fejl"]{border-color:var(--red);background:#2a1512}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:11px}
.chip{
  border:1px solid var(--line);background:var(--panel);border-radius:99px;
  padding:11px 15px;font-size:14px;cursor:pointer;color:var(--ink);
}
.chip.valgt{background:var(--lime);color:#1a1d0b;border-color:var(--lime);font-weight:600}
textarea,input.tal{
  width:100%;background:var(--panel);border:1px solid var(--line);
  border-radius:12px;padding:13px;font-size:16px;margin-bottom:11px;
}
textarea{min-height:84px;resize:vertical}
.navi{display:flex;gap:10px;margin-top:6px}
.navi .knap{margin:0}
.fotork{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:11px}
.fototak{
  width:72px;height:72px;border-radius:10px;background:var(--panel2);
  border:1px solid var(--line);display:grid;place-items:center;
  font-size:12px;color:var(--dim);object-fit:cover;
}

/* ---------- afkrydsning (forberedelse) ---------- */
.hak{
  display:flex;align-items:flex-start;gap:13px;width:100%;text-align:left;
  background:var(--panel);border:1px solid var(--line);border-radius:12px;
  padding:14px;margin-bottom:9px;cursor:pointer;min-height:var(--tap);
}
.hak .boks{
  width:28px;height:28px;border-radius:8px;border:2px solid var(--faint);
  flex:none;display:grid;place-items:center;font-size:17px;color:transparent;margin-top:1px;
}
.hak.klar .boks{background:var(--lime);border-color:var(--lime);color:#1a1d0b}
.hak.klar{background:#1a2016}
.hak .txt{flex:1;min-width:0}
.hak .txt>span{display:block}
.hak .nr{font-size:12px;color:var(--lime);display:block;margin-bottom:2px}
.hak .beskrivelse{font-size:13.5px;color:var(--dim);margin-top:5px}

/* ---------- diverse ---------- */
.tom{text-align:center;padding:48px 20px;color:var(--dim)}
.tom p{margin:0 0 18px;font-size:15px}
#toast{
  position:fixed;left:16px;right:16px;bottom:calc(env(safe-area-inset-bottom) + 18px);
  background:var(--panel2);border:1px solid var(--line);border-radius:12px;
  padding:14px 16px;font-size:14.5px;z-index:60;display:none;
  box-shadow:0 8px 28px rgba(0,0,0,.55);
}
#toast.vis{display:block}
/* Skal ligge over arket — ellers er en fejlbesked fra en dialog usynlig. */
#modal.vis ~ #toast, #toast{z-index:90}
.arkfejl{background:#2d1917;border:1px solid #4a2521;color:#f7c9c3;border-radius:10px;
  padding:10px 12px;font-size:13.5px;margin-bottom:12px}
#toast.fejl{background:#2d1917;border-color:#4a2521;color:#f7c9c3}
.spin{display:inline-block;width:17px;height:17px;border:2px solid var(--line);
  border-top-color:var(--teal);border-radius:50%;animation:sn .7s linear infinite;vertical-align:-3px}
@keyframes sn{to{transform:rotate(360deg)}}
.midt{text-align:center;padding:60px 20px;color:var(--dim)}
.opsaet{background:#241d0f;border:1px solid #4a3c1a;border-radius:12px;padding:14px;font-size:13.5px;margin-bottom:14px;color:#f0dcae}
.opsaet code{font-family:'Space Mono',monospace;font-size:12.5px;word-break:break-all}
/* ---------- bekræftelse ---------- */
#modal{
  position:fixed;inset:0;z-index:80;display:none;
  background:rgba(5,7,4,.72);align-items:flex-end;justify-content:center;
}
#modal.vis{display:flex}
#modal .ark{
  background:var(--panel);border:1px solid var(--line);
  border-radius:16px 16px 0 0;padding:22px 18px calc(env(safe-area-inset-bottom) + 18px);
  width:100%;max-width:640px;
}
#modal h3{margin:0 0 8px;font-size:18px;font-weight:700;letter-spacing:-.01em}
#modal p{margin:0 0 18px;font-size:14.5px;color:var(--dim);line-height:1.5}
@media(min-width:641px){#modal{align-items:center}#modal .ark{border-radius:16px;margin:0 16px}}
/* ---------- listevisning for løftetilbehør ---------- */
.bemne{background:var(--panel);border:1px solid var(--line);border-radius:9px;
  padding:8px 9px 8px 11px;margin-bottom:5px;display:flex;align-items:center;gap:9px}
.bemne.faerdig{opacity:.62}
.bnavn{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.bnavn .mono{font-size:13.5px;font-weight:700;line-height:1.25}
.bnavn .undertxt{font-size:11.5px;color:var(--dim);white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
.bbem{font-size:11.5px;color:var(--amber);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bknap{display:flex;gap:5px;flex:none}
.bknap button{width:44px;height:44px;border-radius:9px;font-size:17px;font-weight:700;
  border:1px solid var(--line);background:var(--panel2);cursor:pointer;padding:0;
  display:grid;place-items:center}
.bknap button[data-s="OK"]{border-color:#2a4a3e;color:var(--teal)}
.bknap button[data-s="Bemærkning"]{border-color:#4a3c1a;color:var(--amber)}
.bknap button[data-s="Fejl"]{border-color:#4a2521;color:#f0a49c}
.bknap button:active{transform:scale(.94)}
.bsvar{font-size:12px;font-weight:700;flex:none;text-align:right;min-width:74px}
.bvaerkt{display:flex;gap:7px;align-items:center;margin-bottom:10px}
#brapport{position:sticky;bottom:var(--faneh,72px);z-index:16;background:var(--bg);
  margin:0 -16px;padding:10px 16px;
  border-top:1px solid var(--line);box-shadow:0 -8px 16px -10px rgba(0,0,0,.95)}
#brapport:empty{display:none}
#brapport .knap{margin:0}
#brapport .vejl{margin:9px 0 0}
body.medfaner main{padding-bottom:96px}
#btop{position:sticky;top:var(--hdr,58px);z-index:15;background:var(--bg);
  padding:10px 0 8px;margin:0 -16px;padding-left:16px;padding-right:16px;
  border-bottom:1px solid var(--line);box-shadow:0 6px 14px -8px rgba(0,0,0,.9)}
#btop .sog{margin-bottom:8px}
.bvaerkt{overflow-x:auto;scrollbar-width:none;margin-bottom:0}
.bvaerkt::-webkit-scrollbar{display:none}
.bvaerkt button{flex:none;white-space:nowrap;border:1px solid var(--line);background:var(--panel);
  color:var(--dim);border-radius:99px;padding:8px 13px;font-size:12.5px;cursor:pointer;min-height:38px}
.bvaerkt button.aktiv{background:var(--panel2);color:var(--lime);border-color:#39432b}
.btael{position:sticky;bottom:0;background:linear-gradient(transparent,var(--bg) 30%);
  padding:14px 0 calc(env(safe-area-inset-bottom) + 10px);margin-top:6px}
/* ---------- fanelinje ---------- */
#faner{
  position:fixed;left:0;right:0;bottom:0;z-index:40;
  display:flex;background:var(--panel);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom);
}
#faner button{
  flex:1;background:none;border:none;color:var(--faint);cursor:pointer;
  padding:9px 2px 8px;display:flex;flex-direction:column;align-items:center;gap:3px;
  font-size:10.5px;line-height:1.2;min-height:60px;position:relative;
}
#faner button .ikon{font-size:19px;line-height:1}
#faner button.aktiv{color:var(--lime)}
#faner button.aktiv::before{
  content:'';position:absolute;top:0;left:22%;right:22%;height:2px;background:var(--lime);
}
#faner .prik{
  position:absolute;top:5px;right:50%;margin-right:-22px;
  background:var(--red);color:#fff;border-radius:99px;font-size:9.5px;
  min-width:17px;height:17px;display:grid;place-items:center;padding:0 4px;font-weight:700;
}
body.medfaner main{padding-bottom:96px}
.fanetop{display:flex;gap:8px;margin-bottom:12px}
.fanetop button{flex:1;border:1px solid var(--line);background:var(--panel);
  color:var(--ink);border-radius:10px;min-height:46px;font-size:14px;font-weight:600;cursor:pointer}
.fanetop button.primaer{background:var(--teal);color:#08201c;border-color:var(--teal)}
.grupper{display:flex;gap:7px;margin-bottom:12px}
.grupper button{flex:1;border:1px solid var(--line);background:var(--panel);
  color:var(--dim);border-radius:99px;min-height:38px;font-size:12.5px;cursor:pointer}
.grupper button.aktiv{background:var(--panel2);color:var(--lime);border-color:#39432b}
/* ---------- galleri ---------- */
.galleri{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-bottom:12px}
.miniatur{aspect-ratio:1;border:1px solid var(--line);border-radius:9px;overflow:hidden;
  background:var(--panel2);display:grid;place-items:center;cursor:pointer;padding:0}
.miniatur img{width:100%;height:100%;object-fit:cover;display:block}
#faner button .ikon{width:22px;height:22px;display:block}
#faner button .ikon svg{width:100%;height:100%}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<div id="net"></div>

<header>
  <button class="iconbtn" id="tilbage" hidden aria-label="Tilbage">‹</button>
  <h1 id="titel">Løfteudstyr<span class="sub" id="undertitel">Indlæser</span></h1>
  <button class="iconbtn" id="menu" hidden aria-label="Log ud">⏻</button>
</header>

<main id="app"><div class="midt"><span class="spin"></span></div></main>
<div id="toast" role="status" aria-live="polite"></div>
<div id="modal" role="dialog" aria-modal="true"></div>
<nav id="faner"></nav>

  /**

  qrcode.createStringToBytes = function(unicodeData, numChars) {

      var bin = base64DecodeInputStream(unicodeData);
      var read = function() {
        var b = bin.read();
        if (b == -1) throw 'eof';
        return b;
      };

      var count = 0;
      var unicodeMap = {};
      while (true) {
        var b0 = bin.read();
        if (b0 == -1) break;
        var b1 = read();
        var b2 = read();
        var b3 = read();
        var k = String.fromCharCode( (b0 << 8) | b1);
        var v = (b2 << 8) | b3;
        unicodeMap[k] = v;
        count += 1;
      }
      if (count != numChars) {
        throw count + ' != ' + numChars;
      }

      return unicodeMap;
    }();

    var unknownChar = '?'.charCodeAt(0);

    return function(s) {
      var bytes = [];
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charCodeAt(i);
        if (c < 128) {
          bytes.push(c);
        } else {
          var b = unicodeMap[s.charAt(i)];
          if (typeof b == 'number') {
            if ( (b & 0xff) == b) {
              // 1byte
              bytes.push(b);
            } else {
              // 2bytes
              bytes.push(b >>> 8);
              bytes.push(b & 0xff);
            }
          } else {
            bytes.push(unknownChar);
          }
        }
      }
      return bytes;
    };

<script>
'use strict';

/* ================================================================== *
 * 1. Opsætning — udfyld disse to, og appen er klar
 * ================================================================== */

const CLIENT_ID = '439959972837-nprf5idj1jnkeb428c57kljbaa7i89jp.apps.googleusercontent.com';
const ENDPOINT  = 'https://script.google.com/macros/s/AKfycbylHv4oc4jnbwv02-pVD8Vqblu3j9NDwiaUervIw6h5KrTyGl3552O3xJim4rli4LTr-g/exec';

const ER_OPSAT = !CLIENT_ID.startsWith('DIT-') && !ENDPOINT.includes('DIT-');

/* ================================================================== *
 * 2. Lokal database — kø og indstillinger
 * ================================================================== */

const DB_NAME='loefteudstyr', DB_VER=1, KØ='kø', CFG='config', CACHE='cache';

function åbnDb(){
  return new Promise((ok,fejl)=>{
    const r=indexedDB.open(DB_NAME,DB_VER);
    r.onupgradeneeded=()=>{
      const db=r.result;
      if(!db.objectStoreNames.contains(KØ))    db.createObjectStore(KØ,{keyPath:'id',autoIncrement:true});
      if(!db.objectStoreNames.contains(CFG))   db.createObjectStore(CFG,{keyPath:'key'});
      if(!db.objectStoreNames.contains(CACHE)) db.createObjectStore(CACHE,{keyPath:'key'});
    };
    r.onsuccess=()=>ok(r.result);
    r.onerror =()=>fejl(r.error);
  });
}
let _db=null;
async function db(){ if(!_db) _db=await åbnDb(); return _db; }

function _op(store,mode,fn){
  return db().then(d=>new Promise((ok,fejl)=>{
    const t=d.transaction(store,mode), s=t.objectStore(store), r=fn(s);
    r.onsuccess=()=>ok(r.result); r.onerror=()=>fejl(r.error);
  }));
}
const dbAlle = s=>_op(s,'readonly', o=>o.getAll());
const dbHent = (s,k)=>_op(s,'readonly', o=>o.get(k)).then(v=>v?v.value:null);
const dbSæt  = (s,k,v)=>_op(s,'readwrite',o=>o.put({key:k,value:v}));
const dbSlet = (s,k)=>_op(s,'readwrite',o=>o.delete(k));
const køLæg  = p=>_op(KØ,'readwrite',o=>o.add(p));

/* ================================================================== *
 * 3. Kald til serveren
 * ================================================================== */

let idToken=null, sessionToken=null, bruger=null, offline=!navigator.onLine;

async function kald(action,args=[]){
  if(!ER_OPSAT) throw new Error('Appen mangler client ID og webapp-adresse. Se øverst i index.html.');
  const svar=await fetch(ENDPOINT,{
    method:'POST',
    // text/plain undgår preflight. Apps Script kan ikke besvare OPTIONS.
    headers:{'Content-Type':'text/plain;charset=utf-8'},
    body:JSON.stringify({idToken,sessionToken,action,args})
  });
  if(!svar.ok) throw new Error('Serveren svarede ikke ('+svar.status+').');
  const d=await svar.json();
  if(!d.ok){
    if(/logget ind|udløbet|token/i.test(d.error||'')) logUd(true);
    throw new Error(d.error||'Ukendt fejl.');
  }
  return d.data;
}

/** Skrivninger: send nu, ellers læg i kø. Svaret går aldrig tabt. */
async function skriv(action,args=[],beskrivelse=''){
  if(navigator.onLine){
    try{ return await kald(action,args); }
    catch(e){
      if(!/Failed to fetch|NetworkError|svarede ikke/i.test(e.message)) throw e;
    }
  }
  await køLæg({action,args,beskrivelse,lagtDato:new Date().toISOString()});
  await visNet();
  bedOmSynk();
  return {i_kø:true};
}

async function hent(action,args=[],cacheNøgle=null){
  try{
    const d=await kald(action,args);
    if(cacheNøgle) dbSæt(CACHE,cacheNøgle,{hentet:Date.now(),data:d});
    return d;
  }catch(e){
    if(cacheNøgle){
      const c=await dbHent(CACHE,cacheNøgle);
      if(c){ c.data.__fraCache=c.hentet; return c.data; }
    }
    throw e;
  }
}

function bedOmSynk(){
  navigator.serviceWorker?.ready.then(reg=>{
    if('sync' in reg) reg.sync.register('send-kø').catch(()=>{});
    reg.active?.postMessage({type:'TØM_KØ'});
  }).catch(()=>{});
}

/* ================================================================== *
 * 4. Netstatus
 * ================================================================== */

const netEl=document.getElementById('net');

async function visNet(){
  const kø=await dbAlle(KØ);
  const fejlede=kø.filter(p=>p.fejl).length;
  netEl.className=''; netEl.textContent='';
  if(!navigator.onLine){
    netEl.className='vis';
    netEl.textContent=kø.length
      ? 'Ingen forbindelse · '+kø.length+' svar venter på at blive sendt'
      : 'Ingen forbindelse · dine svar gemmes og sendes automatisk';
  }else if(fejlede){
    netEl.className='vis';
    netEl.textContent=fejlede+' svar blev afvist af serveren. Tryk for at se hvorfor.';
    netEl.onclick=visKø;
  }else if(kø.length){
    netEl.className='vis sender';
    netEl.textContent='Sender '+kø.length+' svar …';
  }
}

addEventListener('online', ()=>{ offline=false; visNet(); bedOmSynk(); });
addEventListener('offline',()=>{ offline=true;  visNet(); });

navigator.serviceWorker?.addEventListener('message',e=>{
  if(e.data?.type==='KØ_OPDATERET'){
    visNet();
    if(e.data.sendt) toast(e.data.sendt+' svar sendt');
    if(rute.navn==='tjek'||rute.navn==='forb') tegn();
  }
});

/* ================================================================== *
 * 5. Småting
 * ================================================================== */

const $=s=>document.querySelector(s);
const app=$('#app'), titelEl=$('#titel'), tilbageBtn=$('#tilbage'), menuBtn=$('#menu');
let toastTimer=null;

function toast(txt,erFejl=false){
  const t=$('#toast');
  t.textContent=txt; t.className='vis'+(erFejl?' fejl':'');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>t.className='',erFejl?5200:2600);
}
/* ---------- bekræftelse i appen ----------
   confirm() er blokeret i indlejrede vinduer og ser dårlig ud på
   mobil, så vi bruger vores eget ark. */
function bekraeft(titel,tekst,knaptekst,farlig){
  return new Promise(ok=>{
    const m=document.getElementById('modal');
    m.innerHTML='<div class="ark"><h3>'+esc(titel)+'</h3>'+
      (tekst?'<p>'+esc(tekst)+'</p>':'')+
      '<button class="knap '+(farlig?'fare':'primaer')+'" id="mja">'+esc(knaptekst)+'</button>'+
      '<button class="knap" id="mnej">Fortryd</button></div>';
    m.className='vis';
    const luk=svar=>{ m.className=''; m.innerHTML=''; ok(svar); };
    m.querySelector('#mja').onclick=()=>luk(true);
    m.querySelector('#mnej').onclick=()=>luk(false);
    m.onclick=e=>{ if(e.target===m) luk(false); };
  });
}

const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function sætTitel(t,under){
  titelEl.innerHTML=esc(t)+'<span class="sub">'+esc(under||'')+'</span>';
  maalHeader();
}

/** Headerens højde varierer med titlens længde og med sikkerhedszonen. */
function maalHeader(){
  const h=document.querySelector('header');
  if(!h) return;
  const netto=document.getElementById('net');
  const ekstra=(netto&&netto.className)?netto.offsetHeight:0;

    (fn&&fn.innerHTML?fn.offsetHeight:0)+'px');
}

  if(!iso) return '—';
  const m=String(iso).match(/^(\d{4})-(\d{2})-(\d{2})/);

}
const VARSEL={overskredet:'Overskredet',snart:'Udløber snart',ok:'Gyldig',ukendt:'Ingen termin',standset:'Anvendelse standset'};

};

  app.innerHTML='<div class="midt"><span class="spin"></span></div>';

  try{

    else if(rute.navn==='placering')await visPlacering(rute.id);

    else if(rute.navn==='firma')    await visFirma();

 * ================================================================== */

async function visLogin(){
  sætTitel('Løfteudstyr','Eftersyn af kraner og løftegrej');
  app.innerHTML=
    (ER_OPSAT?'':'<div class="opsaet"><b>Appen er ikke sat op endnu.</b><br>'+
      'Åbn <code>index.html</code> og udfyld <code>CLIENT_ID</code> og <code>ENDPOINT</code> øverst i filen.</div>')+
    '<div style="padding-top:18px">'+
      '<h2 class="afsnit">Log ind</h2>'+
      '<div id="gknap" style="display:flex;justify-content:center;margin-bottom:16px"></div>'+

/**

 */
async function tegnGoogleKnap(){
  const boks=$('#gknap');

      'accounts.google.com. Brug koden på e-mail nedenfor i stedet.</div>';

    boks.innerHTML='';
    google.accounts.id.initialize({client_id:CLIENT_ID,callback:påLogin,auto_select:false});
    google.accounts.id.renderButton(boks,
      {theme:'filled_black',size:'large',shape:'pill',text:'signin_with',locale:'da'});
    google.accounts.id.prompt();
  }catch(e){
    boks.innerHTML='<div class="arkfejl" style="width:100%">Google afviste opsætningen: '+
      esc(e.message)+'<br><br>Kontrollér at <b>https://bernt84.github.io</b> står som '+
      'godkendt JavaScript-kilde på OAuth-klienten — uden skråstreg til sidst.</div>';
  }
}

/** Login uden Google-konto: engangskode på e-mail. */
function tegnKodeLogin(email){
  const b=$('#kodeboks');
  b.innerHTML=
    '<div class="vejl" style="font-size:13px">Har du ikke en Google-konto — og vil du '+
    'ikke oprette en — så få en kode på din e-mail i stedet. Det virker med enhver '+
    'adresse, også firmamail.</div>'+
    felt('l_mail','Din e-mail','email','navn@firma.dk',email||'')+
    '<div id="l_fejl"></div>'+
    '<button class="knap primaer" id="l_send">Send mig en kode</button>';

  const vis=t=>{ $('#l_fejl').innerHTML=t?'<div class="arkfejl">'+esc(t)+'</div>':''; };
  $('#l_send').onclick=async()=>{
    const m=$('#l_mail').value.trim();
    if(!m){ vis('Skriv din e-mailadresse.'); return; }
    const k=$('#l_send'); k.disabled=true; k.textContent='Sender …';
    try{
      const r=await kald('api_requestCode',[m]);
      tegnKodeInput(m,r.besked);
    }catch(e){ k.disabled=false; k.textContent='Send mig en kode'; vis(e.message); }
  };
}

function tegnKodeInput(email,besked){
  const b=$('#kodeboks');
  b.innerHTML=
    '<div class="vejl" style="border-color:#2a4a3e;background:#10231f;color:#9fd8c9;'+
    'font-size:13px">'+esc(besked||'Der er sendt en kode til '+email+'.')+'</div>'+
    '<label style="display:block;margin-bottom:11px">'+
      '<span style="display:block;font-size:12.5px;color:var(--dim);margin-bottom:4px">'+
      'Kode fra e-mailen</span>'+
      '<input class="sog mono" style="margin:0;font-size:26px;letter-spacing:.28em;'+
      'text-align:center" id="l_kode" type="text" inputmode="numeric" autocomplete="one-time-code" '+
      'maxlength="6" placeholder="000000"></label>'+
    '<div id="l_fejl"></div>'+
    '<button class="knap primaer" id="l_ok">Log ind</button>'+
    '<button class="knap" id="l_igen" style="min-height:44px;font-size:13.5px;'+
    'font-weight:500">Brug en anden adresse</button>';

  const vis=t=>{ $('#l_fejl').innerHTML=t?'<div class="arkfejl">'+esc(t)+'</div>':''; };
  const felt2=$('#l_kode'); felt2.focus();

  const prøv=async()=>{
    const k=felt2.value.trim();
    if(k.length<6){ vis('Skriv de seks cifre fra e-mailen.'); return; }
    const knap=$('#l_ok'); knap.disabled=true; knap.textContent='Logger ind …';
    try{
      const r=await kald('api_verifyCode',[email,k]);
      sessionToken=r.sessionToken; idToken=null;
      await dbSæt(CFG,'sessionToken',sessionToken);
      await dbSlet(CFG,'idToken');
      await dbSæt(CFG,'endpoint',ENDPOINT);
      const d=await kald('api_me');
      bruger=d.bruger;
      await dbSæt(CFG,'bruger',bruger);
      bedOmSynk();
      historik.length=0; gå({navn:'fane',id:'kraner'},false);
    }catch(e){
      knap.disabled=false; knap.textContent='Log ind';
      vis(e.message); felt2.select();
    }
  };
  $('#l_ok').onclick=prøv;
  felt2.onkeydown=e=>{ if(e.key==='Enter') prøv(); };
  $('#l_igen').onclick=()=>tegnKodeLogin(email);
}

async function påLogin(res){
  idToken=res.credential;
  await dbSæt(CFG,'idToken',idToken);
  await dbSæt(CFG,'endpoint',ENDPOINT);
  app.innerHTML='<div class="midt"><span class="spin"></span></div>';
  try{
    const d=await kald('api_me');
    bruger=d.bruger;
    await dbSæt(CFG,'bruger',bruger);
    bedOmSynk();
    tegn();
  }catch(e){
    idToken=null;
    app.innerHTML='<div class="tom"><p>'+esc(e.message)+'</p>'+
      '<button class="knap" onclick="bruger=null;tegn()">Tilbage</button></div>';
  }
}

async function logUd(stille){
  if(sessionToken){ try{ await kald('api_logoutSession',[sessionToken]); }catch(e){} }
  idToken=null; sessionToken=null; bruger=null; historik.length=0; rute={navn:'liste'};
  await dbSlet(CFG,'idToken'); await dbSlet(CFG,'sessionToken'); await dbSlet(CFG,'bruger');
  google.accounts?.id?.disableAutoSelect?.();
  if(!stille) tegn(); else { toast('Login udløbet. Log ind igen.',true); tegn(); }
}

async function visListe(){
  sætTitel('Løfteudstyr', bruger.rolle==='kunde'?'Jeres udstyr':'Alle terminer');
  const liste=await hent('api_dashboard',[],'dashboard');

  if(!liste.length){
    app.innerHTML='<div class="tom"><p>Der er ikke oprettet udstyr endnu.</p></div>';
    return;
  }

  const h=['<input class="sog" id="sog" placeholder="Søg fabriksnr., type eller fabrikat" autocomplete="off">'];
  const antalOpgaver=liste.reduce((n,e)=>n+(e.aabneFejl||0),0);
  if(antalOpgaver) h.push('<button class="knap" onclick="gå({navn:\'opgaver\'})" '+
    'style="border-color:#4a2521;background:#2d1917;color:#f0a49c">'+
    antalOpgaver+' ting skal laves</button>');

  // Løftetilbehør vises ikke emne for emne — der kan være mange hundrede.
  const tilbehoer=liste.filter(e=>e.listevisning);
  if(tilbehoer.length){
    const overskredne=tilbehoer.filter(e=>e.varsel==='overskredet').length;
    h.push('<h2 class="afsnit">Løftetilbehør</h2>');
    h.push('<button class="rk '+(overskredne?'overskredet':'ok')+'" onclick="gå({navn:\'familie\',id:\'loeftetilbehoer\'})">'+
      '<h3>Stropper, kæder, sjækler og åg</h3>'+
      '<div class="meta">'+tilbehoer.length+' emner</div>'+
      '<div class="termin '+(overskredne?'overskredet':'ok')+'">'+
        (overskredne?overskredne+' overskredet · vælg sted for at gå listen igennem'
                   :'Vælg sted for at gå listen igennem')+'</div></button>');
  }

  if(bruger.rolle!=='kunde'){
    h.push('<div style="display:flex;gap:8px;margin-bottom:4px">'+
      '<button class="knap" onclick="gå({navn:\'opret\'})" style="flex:1;margin:0;min-height:48px;font-size:14.5px">Opret udstyr</button>'+
      '<button class="knap" onclick="gå({navn:\'godkend\'})" style="flex:1;margin:0;min-height:48px;font-size:14.5px">Godkendelser</button></div>');
  }

  const familier=[['traverser','Traverskraner og portalkraner'],
                  ['kraner','Tårnkraner og mobilkraner'],
                  ['oevrigt','Øvrigt udstyr']];
  const grupper=[['overskredet','Overskredet'],['standset','Standset'],
                 ['snart','Inden for 3 måneder'],['ok','Gyldig'],['ukendt','Uden termin']];

  for(const [famId,famNavn] of familier){
    const iFam=liste.filter(e=>!e.listevisning && (e.familie===famId
      || (famId==='oevrigt' && !['traverser','kraner','loeftetilbehoer'].includes(e.familie))));
    if(!iFam.length) continue;
    h.push('<h2 class="afsnit" style="color:var(--lime)">'+esc(famNavn)+' · '+iFam.length+'</h2>');
    for(const [nøgle,navn] of grupper){
      const del=iFam.filter(e=>e.varsel===nøgle);
      if(!del.length) continue;
      h.push('<div style="font-size:12px;color:var(--faint);margin:10px 0 6px">'+navn+'</div>');
      for(const e of del) h.push(rækkeHtml(e));
    }
  }
  app.innerHTML=h.join('');

  $('#sog').oninput=ev=>{
    const q=ev.target.value.toLowerCase().trim();
    document.querySelectorAll('.rk[data-sog]').forEach(r=>{
      r.style.display = !q || r.dataset.sog.includes(q) ? '' : 'none';
    });
  };
  document.querySelectorAll('.rk[data-id]').forEach(r=>{
    r.onclick=()=>gå({navn:'maskine',id:r.dataset.id});
  });
}

function rækkeHtml(e){
  const sog=[e.fabriksnr,e.fabrikat,e.type,e.kategori,e.id].join(' ').toLowerCase();
  const f=e.forberedelse;
  return '<button class="rk '+e.varsel+'" data-id="'+esc(e.id)+'" data-sog="'+esc(sog)+'">'+
    '<h3>'+esc(e.fabrikat)+' '+esc(e.type)+'</h3>'+
    '<div class="meta"><span class="mono">'+esc(e.fabriksnr)+'</span>'+
      '<span>'+esc(e.kategori)+'</span>'+
      (e.wll?'<span>'+esc(e.wll)+' kg</span>':'')+'</div>'+
    '<div class="termin '+e.varsel+'">'+VARSEL[e.varsel]+
      (e.naesteEftersyn?' · '+dkDato(e.naesteEftersyn):'')+'</div>'+
    ((e.aabneFejl||f)?'<div class="merker">'+
      (e.aabneFejl?'<span class="mrk fejl">'+e.aabneFejl+' åbne fejl</span>':'')+
      (f?'<span class="mrk forb">Forberedelse '+f.klar+' af '+f.i_alt+'</span>':'')+
      (e.tiaarsPligtig==='Ja'?'<span class="mrk">10-års</span>':'')+
    '</div>':'')+
  '</button>';
}

let tjekData=null;

async function visTjek(inspId,pos,eqId){
  if(eqId) rute.eqId=eqId;
  tjekData=await hent('api_checklist',[inspId],'tjek_'+inspId);
  const p=tjekData.punkter;
  if(!p.length){ app.innerHTML='<div class="tom"><p>Der er ingen punkter på dette eftersyn.</p></div>'; return; }

  pos=Math.max(0,Math.min(pos,p.length-1));
  rute.pos=pos;
  const pk=p[pos];
  sætTitel(tjekData.kran,'Punkt '+(pos+1)+' af '+p.length);

  const h=[];
  h.push('<div class="fremdrift"><i style="width:'+Math.round(tjekData.besvaret/p.length*100)+'%"></i></div>');
  if(tjekData.kraeverNdt){
    const mangler=!tjekData.ndtUploadet;
    h.push('<div class="vejl" style="border-color:'+(mangler?'#4a3c1a':'#2a4a3e')+
      ';background:'+(mangler?'#241d0f':'#10231f')+';color:'+(mangler?'#f0dcae':'#9fd8c9')+
      '"><h4 style="color:'+(mangler?'#c9a86a':'var(--teal)')+'">NDT</h4>'+
      (mangler
        ? 'Dette eftersyn kræver NDT på '+tjekData.antalProevesteder+' prøvesteder. '+
          'Laboratoriets rapport er ikke uploadet endnu.'
        : 'Laboratoriets NDT-rapport er uploadet.')+
      '<div class="fanetop" style="margin:10px 0 0">'+
        '<button onclick="gå({navn:\'pstd\',id:\''+esc(rute.eqId||'')+'\'})">Se prøvesteder</button>'+
        '<button onclick="gå({navn:\'ndt\',id:\''+esc(inspId)+'\'})">'+
          (mangler?'Upload rapport':'NDT-rapport')+'</button></div></div>');
  }
  h.push('<div class="tael"><span style="cursor:pointer;text-decoration:underline" '+
         'onclick="gå({navn:\'punkter\',id:\''+esc(inspId)+'\'})">'+
         esc(tjekData.besvaret)+' af '+p.length+' besvaret</span>'+
         (tjekData.manglerAntal?'<span>'+tjekData.manglerAntal+' mangler svar eller foto</span>':'<span style="color:var(--teal)">Alt besvaret</span>')+'</div>');

  if(pk.sektion) h.push('<div class="sektion">'+esc(pk.sektion)+'</div>');
  h.push('<h2 class="sporgsmal">'+esc(pk.punkt)+'</h2>');

  if(!pk.maaSvare){
    h.push('<div class="vejl">Dette punkt besvares af inspektøren.</div>');
  }
  if(pk.vejledning) h.push('<div class="vejl"><h4>Sådan gør du</h4>'+esc(pk.vejledning)+'</div>');

  // Findes manualen ikke, skiftes til punktets alternative kriterie.
  const udenManual = pk.grundlag==='Alternativt grundlag' ||
                     (!pk.grundlag && tjekData.manualStatus==='Kan ikke skaffes');
  if(udenManual && pk.altKriterie){
    h.push('<div class="vejl" style="border-color:#4a3c1a;background:#241d0f;color:#f0dcae">'+
      '<h4 style="color:#c9a86a">Uden fabrikantens manual</h4>'+esc(pk.altKriterie)+
      (pk.altHjemmel?'<div style="font-size:12.5px;color:#c9a86a;margin-top:7px">'+
        esc(pk.altHjemmel)+'</div>':'')+'</div>');
  }else if(pk.acceptkriterie){
    h.push('<div class="vejl"><h4>Det er i orden når</h4>'+esc(pk.acceptkriterie)+'</div>');
  }
  if(pk.altKriterie && pk.maaSvare){
    h.push('<button class="knap" id="skiftgrundlag" style="min-height:44px;font-size:13.5px;'+
      'font-weight:500;margin-bottom:14px'+(udenManual?';border-color:#4a3c1a;color:var(--amber)':'')+'">'+
      (udenManual?'✓ Vurderet uden manual':'Manualen kan ikke skaffes')+'</button>');
  }

  if(pk.manualVaerdier && pk.manualVaerdier.length){
    h.push('<div class="vejl" style="border-color:#2a4a3e;background:#10231f;color:#9fd8c9">'+
      '<h4 style="color:var(--teal)">Fra fabrikantens manual</h4>'+
      pk.manualVaerdier.map(v=>'<b class="mono">'+esc(v.vaerdi)+' '+esc(v.enhed)+'</b>'+
        (v.kildetekst?'<div style="font-size:12.5px;opacity:.8;margin-top:3px">«'+
          esc(v.kildetekst)+'»</div>':'')).join('<br>')+
      '<div style="font-size:12px;opacity:.7;margin-top:6px">Aflæst med OCR og bekræftet af dig.</div>'+
      '</div>');
  }

  // Tidligere målinger — uden manual er referencemålet det eneste
  // holdbare sammenligningsgrundlag.
  if(pk.maalinger && pk.maalinger.length){
    h.push('<div class="vejl"><h4>Tidligere målt</h4>'+
      pk.maalinger.map(m=>dkDato(m.dato)+': <b>'+esc(m.vaerdi)+' '+esc(pk.enhed||'')+'</b>').join('<br>')+
      (pk.maalinger.length>1
        ? '<div style="font-size:12.5px;color:var(--dim);margin-top:6px">Første måling '+
          esc(pk.maalinger[0].vaerdi)+' er referencemålet.</div>'
        : '')+'</div>');
  }

  if(pk.maaSvare){
    const harForhold = pk.status==='Fejl'||pk.status==='Bemærkning'||pk.status==='Udbedret';
    h.push('<div class="svar">');
    for(const v of ['OK','Bemærkning','Fejl']){
      h.push('<button data-v="'+v+'" class="'+(pk.status===v?'valgt':'')+'">'+
             '<span class="dot"></span>'+v+'</button>');
    }
    if(harForhold){
      h.push('<button data-v="Udbedret" class="'+(pk.status==='Udbedret'?'valgt':'')+'">'+
             '<span class="dot"></span>Udbedret på stedet</button>');
    }
    h.push('</div>');
    if(pk.status==='Udbedret'&&pk.udbedring){
      h.push('<div class="vejl" style="border-color:#39432b;background:#1e2410;color:#d8e39a">'+
        '<h4 style="color:var(--lime)">Udbedret under eftersynet</h4>'+esc(pk.udbedring)+'</div>');
    }
    h.push('<button class="knap" id="ikkerel" style="min-height:46px;font-size:14.5px;font-weight:500">'+
           (pk.status==='Ikke relevant'?'✓ ':'')+'Ikke relevant for denne maskine</button>');

    if(pk.kraeverMaaling){
      h.push('<input class="tal" id="maal" type="number" inputmode="decimal" step="any" '+
             'placeholder="Måleværdi i '+esc(pk.enhed||'')+'" value="'+esc(pk.maalevaerdi??'')+'">');
    }

    const vis = pk.status==='Bemærkning'||pk.status==='Fejl';
    h.push('<div id="detalje" style="display:'+(vis?'block':'none')+'">');
    if(pk.typiskeFejl.length){
      h.push('<div class="chips">');
      for(const f of pk.typiskeFejl){
        const valgt=(pk.bemaerkning||'').includes(f);
        h.push('<button class="chip'+(valgt?' valgt':'')+'" data-f="'+esc(f)+'">'+esc(f)+'</button>');
      }
      h.push('</div>');
    }
    h.push('<textarea id="bem" placeholder="Beskriv hvad du har set">'+esc(pk.bemaerkning||'')+'</textarea>');
    h.push('</div>');

    h.push('<div class="fotork" id="fotork">'+
      (pk.antalFotos?'<div class="fototak">'+pk.antalFotos+' foto</div>':'')+
      '<label class="fototak" style="cursor:pointer">+ Foto'+
      '<input type="file" accept="image/*" capture="environment" id="fotoind" hidden multiple></label></div>');
    if(pk.kraeverFoto && !pk.antalFotos)
      h.push('<div class="vejl" style="border-color:#4a3c1a;background:#241d0f;color:#f0dcae">Dette punkt kræver mindst ét foto.</div>');
  }

  h.push('<div class="navi">');
  h.push('<button class="knap" id="forrige"'+(pos===0?' disabled':'')+'>Forrige</button>');
  h.push('<button class="knap primaer" id="naeste">'+(pos===p.length-1?'Færdig':'Næste')+'</button>');
  h.push('</div>');
  h.push('<button class="knap" onclick="gå({navn:\'punkter\',id:\''+esc(inspId)+'\'})" '+
    'style="min-height:44px;font-size:13.5px;font-weight:500;margin-top:10px">'+
    'Spring til et andet punkt</button>');
  app.innerHTML=h.join('');

  /* --- handlinger --- */
  document.querySelectorAll('.svar button').forEach(b=>{
    b.onclick=async()=>{
      const nyt=b.dataset.v, gammelt=pk.status;
      const varForhold = gammelt==='Fejl'||gammelt==='Bemærkning';

      if(nyt==='Udbedret'){
        const hvad=await spoergTekst('Hvad blev udbedret?',
          'Gem som udbedret');
        if(hvad===null) return;
        if(!hvad.trim()){ toast('Skriv hvad der blev gjort. Det skal stå i rapporten.',true); return; }
        pk.status='Udbedret'; pk.udbedring=hvad;
        await gem(pk,pos,true,{udbedring:hvad});
        return;
      }

      // Et konstateret forhold må ikke bare forsvinde
      if(varForhold && nyt!=='Fejl' && nyt!=='Bemærkning'){
        const grund=await spoergTekst(
          'Du ændrer "'+gammelt+'" til "'+nyt+'". Hvorfor?',
          'Ret svaret');
        if(grund===null) return;
        if(!grund.trim()){ toast('Skriv hvorfor svaret ændres.',true); return; }
        pk.status=nyt; pk.bemaerkning=''; pk.udbedring='';
        await gem(pk,pos,true,{aendringsgrund:grund,bemaerkningOverstyr:''});
        return;
      }

      document.querySelectorAll('.svar button').forEach(x=>x.classList.remove('valgt'));
      b.classList.add('valgt');
      pk.status=nyt;
      const det=$('#detalje'); if(det) det.style.display=(nyt==='OK')?'none':'block';
      if(nyt==='OK') await gem(pk,pos,true);
    };
  });
  const sg=$('#skiftgrundlag');
  if(sg) sg.onclick=async()=>{
    pk.grundlag = udenManual ? 'Fabrikantens anvisning' : 'Alternativt grundlag';
    if(pk.status){
      try{ await skriv('api_answer',[pk.rowId,{status:pk.status,
        bemaerkning:$('#bem')?.value||pk.bemaerkning||'',
        maalevaerdi:$('#maal')?.value ?? pk.maalevaerdi,
        grundlag:pk.grundlag}]); }catch(e){ toast(e.message,true); }
    }
    visTjek(inspId,pos);
  };

  const ikkeRel=$('#ikkerel');
  if(ikkeRel) ikkeRel.onclick=async()=>{ pk.status='Ikke relevant'; await gem(pk,pos,true); };

  document.querySelectorAll('.chip').forEach(c=>{
    c.onclick=()=>{
      c.classList.toggle('valgt');
      const valgte=[...document.querySelectorAll('.chip.valgt')].map(x=>x.dataset.f);
      const bem=$('#bem'); if(!bem) return;
      const fri=(bem.value||'').split('. ').filter(t=>t && !pk.typiskeFejl.includes(t.trim()));
      bem.value=[...valgte,...fri].join('. ');
    };
  });

  $('#forrige').onclick=()=>{ visTjek(inspId,pos-1); };
  $('#naeste').onclick=async()=>{
    if(pk.maaSvare && pk.status && !await gem(pk,pos,false)) return;
    if(pos===p.length-1) afslutTjek(inspId); else visTjek(inspId,pos+1);
  };

  $('#fotoind')?.addEventListener('change',ev=>uploadFotos(ev,inspId,pk));
  // Nyt punkt skal starte øverst, ellers lander man midt i vejledningen
  scrollTo(0,0);
}

async function gem(pk,pos,gåVidere,ekstra){
  ekstra=ekstra||{};
  let bem=$('#bem')?.value?.trim()||'';
  if(ekstra.bemaerkningOverstyr!==undefined) bem=ekstra.bemaerkningOverstyr;
  const maal=$('#maal')?.value||'';
  if((pk.status==='Bemærkning'||pk.status==='Fejl') && !bem && !ekstra.aendringsgrund){
    toast('Skriv kort hvad du har set. Det skal stå i rapporten.',true);
    $('#bem')?.focus();
    return false;
  }
  if(pk.kraeverMaaling && pk.status==='OK' && maal===''){
    toast('Punktet kræver en måleværdi i '+(pk.enhed||'enhed')+'.',true);
    $('#maal')?.focus();
    return false;
  }
  try{
    const r=await skriv('api_answer',[pk.rowId,{status:pk.status,bemaerkning:bem,
                        maalevaerdi:maal,grundlag:pk.grundlag||'Fabrikantens anvisning',
                        udbedring:ekstra.udbedring,aendringsgrund:ekstra.aendringsgrund}],
                        pk.punkt.slice(0,60));
    pk.bemaerkning=bem; pk.maalevaerdi=maal;
    if(r?.i_kø) toast('Gemt lokalt — sendes når der er net');
    if(gåVidere && pos<tjekData.punkter.length-1) setTimeout(()=>visTjek(rute.id,pos+1),160);
    else if(gåVidere) visTjek(rute.id,pos);
    return true;
  }catch(e){ toast(e.message,true); return false; }
}

async function afslutTjek(inspId){
  const d=await hent('api_checklist',[inspId]);
  const p=d.punkter;
  const udenSvar=p.map((x,i)=>({x,i})).filter(o=>!o.x.status);
  const udenFoto=p.map((x,i)=>({x,i})).filter(o=>o.x.status && o.x.status!=='Ikke relevant'
                                                && o.x.kraeverFoto && !o.x.antalFotos);

  if(!d.kanAfsluttes){
    sætTitel('Der mangler noget',d.besvaret+' af '+d.antal+' besvaret');
    const h=[];
    if(udenSvar.length){
      h.push('<h2 class="afsnit">Mangler svar · '+udenSvar.length+'</h2>');
      for(const o of udenSvar)
        h.push('<button class="rk" data-gaa="'+o.i+'"><h3 style="font-size:14.5px">'+
               esc(o.x.punkt)+'</h3><div class="meta">'+esc(o.x.sektion)+'</div></button>');
    }
    if(udenFoto.length){
      h.push('<h2 class="afsnit">Mangler foto · '+udenFoto.length+'</h2>');
      h.push('<div class="vejl">Disse punkter er besvaret, men rapporten kræver et billede som dokumentation.</div>');
      for(const o of udenFoto)
        h.push('<button class="rk" style="border-left-color:var(--amber)" data-gaa="'+o.i+'">'+
               '<h3 style="font-size:14.5px">'+esc(o.x.punkt)+'</h3>'+
               '<div class="meta">'+esc(o.x.sektion)+'</div></button>');
    }
    h.push('<button class="knap" onclick="gå({navn:\'punkter\',id:\''+esc(inspId)+'\'})" style="margin-top:14px">Se alle punkter</button>');
    h.push('<button class="knap" onclick="gå({navn:\'rapport\',id:\''+esc(inspId)+'\'})">Se rapporten som den er nu</button>');
    app.innerHTML=h.join('');
    document.querySelectorAll('[data-gaa]').forEach(b=>{
      b.onclick=()=>visTjek(inspId,Number(b.dataset.gaa));
    });
    return;
  }
  gå({navn:'rapport',id:inspId});
}

/* ================================================================== *
 * 11. Fotos — komprimeres i browseren
 * ================================================================== */

function komprimer(fil,maks=1600,kvalitet=.7){
  return new Promise((ok,fejl)=>{
    const url=URL.createObjectURL(fil), im=new Image();
    im.onload=()=>{
      URL.revokeObjectURL(url);
      let {width:w,height:h}=im;
      const s=Math.min(1,maks/Math.max(w,h));
      w=Math.round(w*s); h=Math.round(h*s);
      const c=document.createElement('canvas'); c.width=w; c.height=h;
      c.getContext('2d').drawImage(im,0,0,w,h);
      ok({base64:c.toDataURL('image/jpeg',kvalitet).split(',')[1],bredde:w,hoejde:h});
    };
    im.onerror=()=>{ URL.revokeObjectURL(url); fejl(new Error('Billedet kunne ikke læses.')); };
    im.src=url;
  });
}

async function uploadFotos(ev,inspId,pk){
  const filer=[...ev.target.files]; ev.target.value='';
  let n=0;
  for(const f of filer){
    n++;
    toast('Sender foto '+n+' af '+filer.length+' …');
    try{
      const b=await komprimer(f);
      // Ét foto pr. kald. Hele bunken i ét ville ramme både
      // størrelses- og tidsgrænsen i Apps Script.
      const r=await skriv('api_uploadPhoto',
        [{inspectionId:inspId,itemId:pk.rowId,bredde:b.bredde,hoejde:b.hoejde},
         b.base64,'image/jpeg',f.name||'foto.jpg'],
        'Foto til '+pk.punkt.slice(0,40));
      if(r?.i_kø) toast('Foto gemt lokalt — sendes når der er net');
    }catch(e){ toast(e.message,true); return; }
  }
  toast(filer.length+' foto gemt');
  visTjek(inspId,rute.pos);
}

const STATUSFARVE={'OK':'var(--teal)','Bemærkning':'var(--amber)','Fejl':'var(--red)',
                   'Udbedret':'var(--lime)',
                   'Ikke relevant':'var(--faint)','Ikke kontrolleret':'var(--faint)'};

async function visRapport(inspId){
  const d=await hent('api_reportPreview',[inspId]);
  const e=d.eftersyn, u=d.udstyr;
  sætTitel(e.typeNavn, u.fabrikat+' '+u.type+' · '+dkDato(e.dato));

  const h=[];

  if(!e.konklusion){
    if(d.mangler.length){
      h.push('<div class="vejl" style="border-color:#4a3c1a;background:#241d0f;color:#f0dcae">'+
        '<h4 style="color:#c9a86a">Før rapporten kan udstedes</h4><ul style="margin:6px 0 0;padding-left:18px">'+

        'Alt er på plads. Vælg konklusion nederst for at afslutte eftersynet.</div>');

  }

  const par=(a,b)=>'<dl class="par"><dt>'+esc(a)+'</dt><dd>'+esc(b||'—')+'</dd></dl>';

  h.push('<h2 class="afsnit">1 · Identifikation</h2><div class="kort">');
  h.push(par('Fabrikat og type',u.fabrikat+' '+u.type));
  h.push(par('Fabriksnr.',u.fabriksnr));

  h.push(par('Største last',u.wll?u.wll+' kg':''));
  h.push(par('Ejer',d.ejer?d.ejer.navn:''));
  h.push(par('Placering',d.placering));
  h.push('</div>');

  h.push('<h2 class="afsnit">2 · Grundlag</h2><div class="kort">');
  if(d.manglerStatus||d.manualStatus) h.push(par('Fabrikantens manual',d.manualStatus));

  h.push(par('Regelgrundlag',e.lovhenvisning));
  h.push(par('Udført',dkDato(e.dato)));
  if(d.inspektoer){
    h.push(par('Sagkyndig',d.inspektoer.navn));
    h.push(par('Kompetence',d.inspektoer.saerligtSagkyndig==='Ja'
      ?'Særligt sagkyndig §73 stk. 5':'Sagkyndig §58 stk. 2'));
  }
  h.push('</div>');
  if(d.udbedretUnder){
    h.push('<div class="vejl" style="border-color:#39432b;background:#1e2410;color:#d8e39a;'+
      'margin-top:-6px">'+d.udbedretUnder+' forhold blev konstateret og udbedret under '+
      'eftersynet. De fremgår ved de enkelte punkter.</div>');
  }
  if(d.altGrundlag){
    h.push('<div class="vejl" style="border-color:#4a3c1a;background:#241d0f;color:#f0dcae;'+
      'margin-top:-6px">'+d.altGrundlag+' punkt(er) er vurderet uden fabrikantens '+
      'manual. Grundlaget står ved hvert enkelt punkt nedenfor.</div>');
  }

  if(d.udfoerende.length>1){
    h.push('<h2 class="afsnit">3 · Hvem udførte hvad</h2><div class="kort">');

      h.push('<div class="kort'+(kanRettes?' rettbar':'')+'"'+

        (p.maalevaerdi!==''&&p.maalevaerdi!=null?'<div class="mono" style="font-size:13px;color:var(--dim);margin-top:5px">'+
          esc(p.maalevaerdi)+' '+esc(p.enhed||'')+'</div>':'')+
        (p.bemaerkning?'<div style="font-size:14px;color:#cfd8c8;margin-top:6px">'+esc(p.bemaerkning)+'</div>':'')+
        (p.udbedring?'<div style="font-size:13.5px;color:var(--lime);margin-top:6px">'+
          '<b>Udbedret under eftersynet:</b> '+esc(p.udbedring)+'</div>':'')+
        (p.grundlag==='Alternativt grundlag'
          ?'<div style="font-size:12px;color:var(--amber);margin-top:6px">Vurderet uden fabrikantens manual'+
            (p.altHjemmel?' · '+esc(p.altHjemmel):'')+'</div>':'')+
        (p.kilde&&p.kilde!=='Egen konstatering'
          ?'<div style="font-size:12px;color:var(--lime);margin-top:6px">'+esc(p.kilde)+'</div>':'')+
      '</div>');
    }
  }

  if(d.ndt.length || bruger.rolle!=='kunde'){
    h.push('<h2 class="afsnit">'+(nr++)+' · Ikke-destruktiv prøvning</h2>');
    if(bruger.rolle!=='kunde' && !e.konklusion){
      h.push('<button class="knap" onclick="gå({navn:\'ndt\',id:\''+esc(inspId)+'\'})">'+
        (d.ndt.length?'Upload endnu en NDT-rapport':'Upload NDT-rapport')+'</button>');
    }
    for(const r of d.ndt){
      h.push('<div class="kort">'+par('Laboratorium',r.laboratorium)+
        par('Rapportnr.',r.rapportnr)+par('Rapportdato',dkDato(r.rapportdato))+
        par('Standard',r.standard)+par('Acceptkriterie',r.accept)+
        par('Samlet resultat',r.samletResultat)+'</div>');
      for(const x of r.resultater){
        h.push('<div class="kort" style="border-left:4px solid '+
          (x.resultat==='Afvist'?'var(--red)':'var(--teal)')+'">'+
          '<div style="display:flex;justify-content:space-between;gap:10px">'+
          '<div style="flex:1"><span class="mono" style="font-size:12px;color:var(--lime)">'+esc(x.testPointId)+'</span>'+
          '<div style="font-size:14px;margin-top:2px">'+esc(x.betegnelse)+'</div></div>'+
          '<div style="font-size:13px;font-weight:600;flex:none">'+esc(x.resultat)+'</div></div>'+
          (x.indikation&&x.indikation!=='Ingen'
            ?'<div style="font-size:13.5px;color:var(--dim);margin-top:5px">'+esc(x.indikationstype)+
             (x.laengde?', '+esc(x.laengde)+' mm':'')+'</div>':'')+
        '</div>');
      }
    }
  }

  if(d.belastningsproever.length){
    h.push('<h2 class="afsnit">'+(nr++)+' · Belastningsprøve</h2>');
    for(const l of d.belastningsproever){
      h.push('<div class="kort">'+par('Prøvelast',l.proevelastKg+' kg ('+l.proevelastPct+' %)')+
        par('Metode',l.metode)+par('Resultat',l.resultat)+par('Attest',l.attestNr)+'</div>');
    }
  }

  h.push('<h2 class="afsnit">'+(nr++)+' · Hvad skal der laves</h2>');
  if(!d.fejl.length){
    h.push('<div class="kort" style="color:var(--dim)">Ingen åbne forhold.</div>');
  }else{
    for(const f of d.fejl) h.push(opgaveKort(f));
  }

  if(e.afgraensning){
    h.push('<h2 class="afsnit">'+(nr++)+' · Afgrænsning</h2>');
    h.push('<div class="kort" style="font-size:14.5px">'+esc(e.afgraensning)+'</div>');
  }

  h.push('<h2 class="afsnit">'+(nr++)+' · Konklusion</h2>');
  if(e.konklusion){
    h.push('<div class="kort" style="border-left:4px solid '+
      (e.konklusion.startsWith('Ikke')?'var(--red)':'var(--teal)')+'">'+
      '<div style="font-size:16px;font-weight:700">'+esc(e.konklusion)+'</div>'+
      (e.naesteTermin?'<div style="font-size:13.5px;color:var(--dim);margin-top:6px">'+
        'Næste eftersyn senest '+dkDato(e.naesteTermin)+'</div>':'')+'</div>');

    if(bruger.rolle!=='kunde'){
      h.push('<h2 class="afsnit">Rapport til ejeren</h2>');
      h.push('<button class="knap primaer" id="danrap">Dan og hent rapporten som PDF</button>');
      if(d.rapport && d.rapport.id){
        h.push('<button class="knap" id="hentigen">Hent den igen</button>');
        h.push(d.rapport.udleveret==='Ja'
          ? '<div class="kort" style="border-left:4px solid var(--teal)">'+
            '<div style="font-weight:600">Udleveret til ejeren</div>'+
            '<div style="font-size:13px;color:var(--dim);margin-top:4px">'+
            dkDato(d.rapport.udleveretDato)+' · '+esc(d.rapport.udleveretMetode)+'</div></div>'
          : '<button class="knap" id="udlev">Registrér udlevering til ejeren</button>'+
            '<div class="vejl" style="font-size:13px">Rapporten skal udleveres til ejeren, '+
            'jf. §73 stk. 6. Registreringen er din dokumentation for at det er sket.</div>');
      }
    }
  }else if(d.kanKonkluderes && bruger.rolle!=='kunde'){
    h.push('<textarea id="afgr" placeholder="Afgrænsning — hvad var ikke omfattet, og hvorfor">'+
           esc(e.afgraensning||'')+'</textarea>');
    for(const k of d.konklusioner){
      h.push('<button class="knap'+(k==='Godkendt'?' primaer':k.startsWith('Ikke')?' fare':'')+
             '" data-k="'+esc(k)+'">'+esc(k)+'</button>');
    }
  }else{
    h.push('<div class="kort" style="color:var(--dim)">Konklusionen sættes, når alt ovenfor er på plads.</div>');
  }
  app.innerHTML=h.join('');

  // Ret et punkt direkte fra rapporten
  document.querySelectorAll('[data-ret]').forEach(el=>{
    el.onclick=async()=>{
      try{
        const c=await hent('api_checklist',[inspId]);
        const i=c.punkter.findIndex(x=>x.punkt===el.dataset.ret);
        if(i<0){ toast('Punktet kunne ikke findes.',true); return; }
        historik.push(rute); visTjek(inspId,i);
      }catch(err){ toast(err.message,true); }
    };
  });

  const dr=$('#danrap');
  if(dr) dr.onclick=async()=>{ const r=await danRapport(inspId); if(r) visRapport(inspId); };
  const hi=$('#hentigen');
  if(hi) hi.onclick=async()=>{
    try{ const r=await kald('api_downloadReport',[d.rapport.id]);
         hentFil(r.base64,r.mime,r.filnavn); }catch(e){ toast(e.message,true); }
  };
  const ul=$('#udlev');
  if(ul) ul.onclick=()=>udlever(d.rapport.id);

  document.querySelectorAll('[data-k]').forEach(b=>{
    b.onclick=async()=>{
      const ja=await bekraeft('Afslut eftersynet?',
        'Konklusionen bliver "'+b.dataset.k+'". En udstedt rapport kan ikke rettes bagefter '+
        '— rettelser sker med et tillæg.','Afslut og udsted',b.dataset.k.startsWith('Ikke'));
      if(!ja) return;
      b.disabled=true;
      try{
        await kald('api_concludeInspection',[inspId,b.dataset.k,$('#afgr')?.value||'','']);
        toast('Eftersynet er afsluttet');
        visRapport(inspId);
      }catch(err){ b.disabled=false; toast(err.message,true); }
    };
  });
}

/* ================================================================== *
 * 17. Opgaver — hvad skal der laves

function opgaveKort(f){
  const farve=f.alvorlighed==='Kritisk'?'var(--red)':
              f.alvorlighed==='Væsentlig'?'var(--amber)':'var(--line)';
  return '<div class="kort'+(f.id?' rettbar':'')+'"'+(f.id?' data-fejl="'+esc(f.id)+'"':'')+
    ' style="border-left:4px solid '+farve+(f.id?';cursor:pointer':'')+'">'+
    '<div style="display:flex;justify-content:space-between;gap:10px">'+
      '<div style="font-weight:700;font-size:13.5px;color:'+farve+'">'+esc(f.alvorlighed)+'</div>'+
      (f.frist?'<div style="font-size:13px;flex:none;'+(f.forfalden?'color:var(--red);font-weight:600':'color:var(--dim)')+'">'+
        (f.forfalden?'Overskredet ':'Frist ')+dkDato(f.frist)+'</div>':'')+
    '</div>'+
    (f.maskine?'<div style="font-size:13px;color:var(--dim);margin-top:3px">'+esc(f.maskine)+
      ' · <span class="mono">'+esc(f.fabriksnr)+'</span></div>':'')+
    '<div style="font-size:14.5px;margin-top:6px">'+esc(f.beskrivelse)+'</div>'+
    (f.placering?'<div style="font-size:12.5px;color:var(--faint);margin-top:5px">'+esc(f.placering)+'</div>':'')+
  '</div>';
}

async function visOpgaver(){
  const liste=await hent('api_opgaver',[]);
  sætTitel('Hvad skal der laves',liste.length+' åbne forhold');
  if(!liste.length){
    app.innerHTML='<div class="tom"><p>Der er ingen åbne forhold på jeres udstyr.</p></div>';
    return;
  }
  const h=[];
  const grupper=[['Kritisk','Kranen må ikke anvendes'],['Væsentlig','Skal udbedres'],['Bemærkning','Til orientering']];
  for(const [alv,tekst] of grupper){
    const del=liste.filter(f=>f.alvorlighed===alv);
    if(!del.length) continue;
    h.push('<h2 class="afsnit">'+esc(tekst)+' · '+del.length+'</h2>');
    for(const f of del) h.push(opgaveKort(f));
  }
  const andre=liste.filter(f=>!['Kritisk','Væsentlig','Bemærkning'].includes(f.alvorlighed));
  if(andre.length){ h.push('<h2 class="afsnit">Øvrige · '+andre.length+'</h2>'); andre.forEach(f=>h.push(opgaveKort(f))); }
  app.innerHTML=h.join('');
  document.querySelectorAll('[data-fejl]').forEach(b=>{
    b.onclick=()=>gå({navn:'fejl',id:b.dataset.fejl});
  });
}

async function visFamilie(familieId){
  const steder=await hent('api_locationsFor',[familieId]);
  sætTitel('Løftetilbehør',steder.reduce((n,s)=>n+s.antal,0)+' emner på '+steder.length+' steder');

  if(!steder.length){
    app.innerHTML='<div class="tom"><p>Der er ikke registreret løftetilbehør endnu.</p></div>';
    return;
  }

  const h=['<div class="vejl">Vælg et sted. Så får du hele listen og kan gå den igennem '+
           'emne for emne uden at skulle ind og ud af hver enkelt.</div>'];
  for(const s of steder){
    h.push('<button class="rk '+s.varsel+'" data-loc="'+esc(s.locationId)+'">'+
      '<h3>'+esc(s.betegnelse)+'</h3>'+
      (s.adresse?'<div class="meta">'+esc(s.adresse)+'</div>':'')+
      '<div class="termin '+s.varsel+'">'+esc(s.antal)+' emner'+
        (s.naesteTermin?' · næste termin '+dkDato(s.naesteTermin):'')+'</div>'+
      '<div class="merker">'+
        (s.overskredet?'<span class="mrk fejl">'+s.overskredet+' overskredet</span>':'')+
        (s.snart?'<span class="mrk forb">'+s.snart+' inden 3 mdr.</span>':'')+
        s.kategorier.slice(0,3).map(k=>'<span class="mrk">'+esc(k.navn)+' '+k.antal+'</span>').join('')+
      '</div></button>');
  }
  app.innerHTML=h.join('');

  document.querySelectorAll('[data-loc]').forEach(b=>{
    b.onclick=async()=>{
      if(bruger.rolle==='kunde'){ toast('Kun inspektøren kan starte en gennemgang',true); return; }
      b.style.opacity='.5';
      try{
        const r=await kald('api_batchStart',[b.dataset.loc,familieId,'T-05']);
        toast(r.genoptaget?'Fortsætter påbegyndt gennemgang':r.antal+' emner klar');
        gå({navn:'batch',id:r.batchId});
      }catch(e){ b.style.opacity=''; toast(e.message,true); }
    };
  });
}

/* ---- selve listen ---- */

let batchData=null, batchFilter='', skjulFaerdige=false;

const BSVAR={'OK':['✓','Godkendt','var(--teal)'],
             'Bemærkning':['!','Bemærkning','var(--amber)'],
             'Fejl':['✕','Kasseret','var(--red)']};

async function visBatch(batchId){
  batchData=await hent('api_batchList',[batchId]);
  const d=batchData;
  sætTitel(d.lokation,d.faerdige+' af '+d.antal+' gennemgået');

  const h=[];
  // Toppen fryses, så man kan se hvor man er, når man scroller gennem
  // flere hundrede emner.
  h.push('<div id="btop">');
  h.push('<div class="fremdrift" style="margin:0 -16px 10px"><i id="bfrem" style="width:'+
         Math.round(d.faerdige/Math.max(d.antal,1)*100)+'%"></i></div>');
  h.push('<input class="sog" id="bsog" placeholder="Søg ID, type eller kategori" '+
         'autocomplete="off" value="'+esc(batchFilter)+'">');
  h.push('<div class="bvaerkt">'+
    '<button id="bguide">Hvad skal tjekkes?</button>'+
    '<button id="bskjul" class="'+(skjulFaerdige?'aktiv':'')+'">'+
      (skjulFaerdige?'Kun manglende':'Skjul færdige')+'</button>'+
    '<span style="font-size:12.5px;color:var(--dim)" id="btael">'+d.antal+' emner</span></div>');
  h.push('</div>');
  if(d.kasserede) h.push('<div class="vejl" style="border-color:#4a2521;background:#2d1917;color:#f0a49c;font-size:13.5px">'+
    d.kasserede+' emne(r) er kasseret og taget ud af drift.</div>');

  h.push('<div id="bliste">'+d.raekker.map(raekkeBatch).join('')+'</div>');
  h.push('<div id="brapport"></div>');
  app.innerHTML=h.join('');
  opdaterRapportKnap(batchId);

  $('#bsog').oninput=ev=>{ batchFilter=ev.target.value.toLowerCase().trim(); filtrerBatch(); };
  $('#bguide').onclick=()=>visBatchGuide(batchId);
  $('#bskjul').onclick=()=>{
    skjulFaerdige=!skjulFaerdige;
    const b=$('#bskjul');
    b.classList.toggle('aktiv',skjulFaerdige);
    b.textContent=skjulFaerdige?'Viser kun manglende':'Skjul færdige';
    filtrerBatch();
  };
  filtrerBatch();
  bindBatch(batchId);
  scrollTo(0,0);
}

/** Rapportknappen skal følge med, også når kun én række er opdateret. */
function opdaterRapportKnap(batchId){
  const boks=$('#brapport');
  if(!boks||!batchData) return;
  const d=batchData;
  const nye=d.nyeSidenSidst!==undefined?d.nyeSidenSidst:d.faerdige;
  if(!nye||bruger.rolle==='kunde'){ boks.innerHTML=''; return; }

  boks.innerHTML='<button class="knap primaer" id="bdan">'+
    'Dan rapport for '+nye+(nye===1?' inspiceret emne':' inspicerede emner')+'</button>';

  $('#bdan').onclick=async()=>{
    toast('Danner listerapporten \u2026');
    try{
      const r=await kald('api_generateBatchReport',[batchId]);
      hentFil(r.base64,r.mime,r.filnavn);
      toast('Rapport '+r.rapportnr+' · '+r.antal+' emner');
      visBatch(batchId);
    }catch(e){ toast(e.message,true); }
  };
}

function filtrerBatch(){
  let synlige=0;
  document.querySelectorAll('.bemne').forEach(r=>{
    const passer=(!batchFilter||r.dataset.sog.includes(batchFilter)) &&
                 (!skjulFaerdige||r.dataset.faerdig!=='1');
    r.style.display=passer?'':'none';
    if(passer) synlige++;
  });
  const t=$('#btael');
  if(t) t.textContent=synlige===batchData.antal?batchData.antal+' emner':synlige+' af '+batchData.antal+' vist';
}

function raekkeBatch(r){
  const sog=[r.fabriksnr,r.kategori,r.type,r.fabrikat,r.wll].join(' ').toLowerCase();
  const kasseret=r.konklusion&&r.konklusion.startsWith('Ikke');
  const svar=kasseret?'Fejl':r.status==='Bemærkning'?'Bemærkning':r.afsluttet?'OK':'';
  const farve=svar?BSVAR[svar][2]:'var(--line)';
  return '<div class="bemne'+(r.afsluttet?' faerdig':'')+'" data-sog="'+esc(sog)+'" '+
    'data-i="'+esc(r.inspectionId)+'" data-row="'+esc(r.hovedRowId)+'" '+
    'data-faerdig="'+(r.afsluttet?1:0)+'" style="border-left:3px solid '+farve+'">'+
    '<div class="bnavn"><span class="mono">'+esc(r.fabriksnr)+'</span>'+
      '<span class="undertxt">'+esc(r.kategori)+(r.wll?' · '+esc(r.wll)+' kg':'')+
        (r.afsluttet&&r.dato?' · '+dkDato(r.dato):'')+'</span>'+
      (r.aarsag?'<span class="bbem">'+esc(r.aarsag)+
      (r.bemaerkning?' · '+esc(r.bemaerkning):'')+'</span>'
      :r.bemaerkning?'<span class="bbem">'+esc(r.bemaerkning)+'</span>':'')+
    '</div>'+
    (r.afsluttet
      ? (r.reportId
        ? '<div class="bsvar" style="color:'+farve+'">'+BSVAR[svar][1]+
          '<span style="display:block;font-size:10.5px;color:var(--faint);font-weight:400">rapporteret</span></div>'
        : '<button class="bsvar bgenaabn" data-genaabn="'+esc(r.inspectionId)+'" '+
        'style="color:'+farve+';background:none;border:none;cursor:pointer;'+
        'text-decoration:underline;padding:0">'+BSVAR[svar][1]+'</button>')
      : '<div class="bknap">'+
          Object.keys(BSVAR).map(k=>'<button data-s="'+k+'" aria-label="'+BSVAR[k][1]+'">'+
            BSVAR[k][0]+'</button>').join('')+'</div>')+
  '</div>';
}

function bindBatch(batchId){
  const liste=$('#bliste');
  if(!liste) return;
  // Én lytter på hele listen — 214 rækker skal ikke have hver sin.
  liste.onclick=async ev=>{
    const gen=ev.target.closest('[data-genaabn]');
    if(gen){
      const ja=await bekraeft('Ret svaret?',
        'Emnet åbnes igen, så du kan svare forfra. Det skrives i loggen.','Ret svaret');
      if(!ja) return;
      try{
        await kald('api_batchReopen',[gen.dataset.genaabn,'Rettet i marken']);
        toast('Emnet er åbnet igen');
        visBatch(batchId);
      }catch(e){ toast(e.message,true); }
      return;
    }
    const knap=ev.target.closest('.bknap button');
    if(!knap) return;
    const emne=knap.closest('.bemne');
    const status=knap.dataset.s;

    let bem='', aarsag='';
    if(status!=='OK'){
      const r=await spoergAarsag(
        (batchData.raekker.find(x=>x.inspectionId===emne.dataset.i)||{}).kategori, status);
      if(r===null) return;
      aarsag=r.aarsag; bem=r.bemaerkning;
    }

    emne.style.opacity='.4';
    try{
      await skriv('api_batchAnswer',[emne.dataset.i,emne.dataset.row,status,bem,aarsag],
                  'Løftetilbehør '+emne.dataset.i);
      // Kun denne række gentegnes. Med flere hundrede emner ville en
      // fuld gentegning koste både tid og din plads i listen.
      const r=batchData.raekker.find(x=>x.inspectionId===emne.dataset.i);
      r.status=status; r.bemaerkning=bem; r.aarsag=aarsag; r.afsluttet=true;
      r.konklusion=status==='Fejl'?'Ikke godkendt – anvendelse standset'
                  :status==='Bemærkning'?'Godkendt med bemærkninger':'Godkendt';
      emne.outerHTML=raekkeBatch(r);

      batchData.faerdige++;
      batchData.nyeSidenSidst=(batchData.nyeSidenSidst||0)+1;
      if(status==='Fejl') batchData.kasserede++;
      batchData.alleFaerdige=batchData.faerdige===batchData.antal;
      sætTitel(batchData.lokation,batchData.faerdige+' af '+batchData.antal+' gennemgået');
      const f=$('#bfrem');
      if(f) f.style.width=Math.round(batchData.faerdige/batchData.antal*100)+'%';
      if(skjulFaerdige) filtrerBatch();
      opdaterRapportKnap(batchId);
      if(batchData.alleFaerdige) toast('Alle '+batchData.antal+' emner er gennemgået');
    }catch(e){ emne.style.opacity=''; toast(e.message,true); }
  };
}

/** Ark med faste årsager plus mulighed for at skrive selv. */
function spoergAarsag(kategori,status){
  return new Promise(async ok=>{
    let d={aarsager:[],andet:'Andet'};
    try{ d=await hent('api_discardReasons',[kategori]); }catch(e){}
    const m=document.getElementById('modal');
    const kasseres = status==='Fejl';
    m.innerHTML='<div class="ark" style="max-height:86vh;overflow-y:auto">'+
      '<h3>'+(kasseres?'Hvorfor kasseres emnet?':'Hvad bemærkede du?')+'</h3>'+
      '<p>'+esc(kategori||'Emnet')+' · vælg årsag. Vælg "Andet", hvis den ikke står på listen.</p>'+
      '<div id="afejl"></div>'+
      '<div class="chips" id="aa">'+
        d.aarsager.map(x=>'<button class="chip" data-a="'+esc(x)+'">'+esc(x)+'</button>').join('')+
        '<button class="chip" data-a="Andet">Andet</button></div>'+
      '<textarea id="atxt" placeholder="Uddybning — mål, placering, hvad du så"></textarea>'+
      '<button class="knap '+(kasseres?'fare':'primaer')+'" id="mja">'+
        (kasseres?'Kassér emnet':'Gem bemærkning')+'</button>'+
      '<button class="knap" id="mnej">Fortryd</button></div>';
    m.className='vis';

    let valgt=null;
    const txt=m.querySelector('#atxt');
    m.querySelectorAll('[data-a]').forEach(b=>{
      b.onclick=()=>{
        m.querySelectorAll('[data-a]').forEach(x=>x.classList.remove('valgt'));
        b.classList.add('valgt'); valgt=b.dataset.a;
        if(valgt==='Andet') txt.focus();
      };
    });
    const luk=v=>{ m.className=''; m.innerHTML=''; ok(v); };
    m.querySelector('#mnej').onclick=()=>luk(null);
    m.querySelector('#mja').onclick=()=>{
      const fri=txt.value.trim();
      const fe=m.querySelector('#afejl');
      if(!valgt){ fe.innerHTML='<div class="arkfejl">Vælg en årsag.</div>'; return; }
      if(valgt==='Andet'&&!fri){
        fe.innerHTML='<div class="arkfejl">Skriv årsagen, når du vælger Andet.</div>'; return; }
      luk({aarsag:valgt==='Andet'?'Andet':valgt, bemaerkning:fri});
    };
    m.onclick=e=>{ if(e.target===m) luk(null); };
  });
}

/** Lille tekstark – bruges når en bemærkning er påkrævet. */
function spoergTekst(titel,knaptekst){
  return new Promise(ok=>{
    const m=document.getElementById('modal');
    m.innerHTML='<div class="ark"><h3>'+esc(titel)+'</h3>'+
      '<textarea id="mtxt" placeholder="Skriv kort hvad du så"></textarea>'+
      '<button class="knap primaer" id="mja">'+esc(knaptekst)+'</button>'+
      '<button class="knap" id="mnej">Fortryd</button></div>';
    m.className='vis';
    const txt=m.querySelector('#mtxt'); txt.focus();
    const luk=v=>{ m.className=''; m.innerHTML=''; ok(v); };
    m.querySelector('#mja').onclick=()=>luk(txt.value);
    m.querySelector('#mnej').onclick=()=>luk(null);
    m.onclick=e=>{ if(e.target===m) luk(null); };
  });
}

async function visOpret(familieId){
  const [alle,steder]=await Promise.all([hent('api_categories',[]),hent('api_allLocations',[])]);

  // Kommer man fra en fane, skal kun den families kategorier vises.
  const famer = familieId ? alle.filter(f=>f.id===familieId) : alle;
  const godkendte=famer.flatMap(f=>f.kategorier.filter(k=>k.godkendt));
  const famNavn = familieId && famer[0] ? famer[0].navn : 'Nyt emne i systemet';
  sætTitel('Opret udstyr',famNavn);

  if(!famer.length){
    app.innerHTML='<div class="tom"><p>Ukendt kategorigruppe.</p></div>';
    return;
  }
  if(!godkendte.length){
    const iAlt=alle.flatMap(f=>f.kategorier.filter(k=>k.godkendt)).length;
    app.innerHTML='<div class="tom"><p>Du er ikke godkendt til nogen kategorier '+
      (familieId?'under '+esc(famNavn.toLowerCase()):'')+'.</p>'+
      (iAlt?'<p style="font-size:13.5px">Du er godkendt til '+iAlt+' kategorier under de '+
        'øvrige faner — prøv der.</p>'
       :'<p style="font-size:13.5px">Bed administratoren om adgang under Godkendelser.</p>')+
      '</div>';
    return;
  }

  const h=[];
  // Én kategori: spring valget over og gå direkte til formularen.
  if(godkendte.length>1){
    h.push('<h2 class="afsnit">Kategori</h2>');
    for(const f of famer){
      const mine=f.kategorier.filter(k=>k.godkendt);
      if(!mine.length) continue;
      if(famer.length>1){
        h.push('<div style="font-size:12px;color:var(--faint);margin:10px 0 6px">'+
               esc(f.navn)+'</div>');
      }
      h.push('<div class="chips">'+mine.map(k=>
        '<button class="chip" data-kat="'+esc(k.navn)+'" data-fam="'+esc(f.id)+'">'+
        esc(k.navn)+'</button>').join('')+'</div>');
    }
  }
  h.push('<div id="formular" style="display:none"></div>');
  app.innerHTML=h.join('');

  document.querySelectorAll('[data-kat]').forEach(b=>{
    b.onclick=()=>{
      document.querySelectorAll('[data-kat]').forEach(x=>x.classList.remove('valgt'));
      b.classList.add('valgt');
      tegnOpretFormular(b.dataset.kat,b.dataset.fam,steder);
    };
  });

  if(godkendte.length===1){
    tegnOpretFormular(godkendte[0].navn,famer[0].id,steder);
  }
}

function felt(id,etiket,type,pladsholder,vaerdi){
  return '<label style="display:block;margin-bottom:11px">'+
    '<span style="display:block;font-size:12.5px;color:var(--dim);margin-bottom:4px">'+esc(etiket)+'</span>'+
    '<input class="sog" style="margin:0" id="'+id+'" type="'+type+'" '+
    (type==='number'?'inputmode="decimal" ':'')+
    'placeholder="'+esc(pladsholder||'')+'" value="'+esc(vaerdi||'')+'"></label>';
}

function vaelg(id,etiket,muligheder,valgt){
  return '<label style="display:block;margin-bottom:11px">'+
    '<span style="display:block;font-size:12.5px;color:var(--dim);margin-bottom:4px">'+esc(etiket)+'</span>'+
    '<select class="sog" style="margin:0" id="'+id+'">'+
    muligheder.map(m=>'<option value="'+esc(m[0])+'"'+(m[0]===valgt?' selected':'')+'>'+
      esc(m[1])+'</option>').join('')+'</select></label>';
}

function tegnOpretFormular(kategori,familie,steder){
  const mange=familie==='loeftetilbehoer';
  const h=['<h2 class="afsnit">'+esc(kategori)+'</h2>'];

  h.push(felt('f_fabrikat','Fabrikat','text','Fx Potain, Demag, Certex'));
  h.push(felt('f_type','Type eller betegnelse','text','Fx IGO T130, 6x36WS 16 mm'));

  if(mange){
    h.push('<div class="vejl">En reol med ens stropper oprettes på én gang. '+
           'Numrene får et løbenummer efter præfikset.</div>');
    h.push(felt('f_fabriksnr','Nummerpræfiks','text','Fx HAL3'));
    h.push('<div style="display:flex;gap:10px">'+
      '<div style="flex:1">'+felt('f_antal','Antal','number','1','1')+'</div>'+
      '<div style="flex:1">'+felt('f_start','Første nummer','number','1','1')+'</div></div>');
  }else{
    h.push(felt('f_fabriksnr','Fabriksnummer','text','Står på maskinskiltet'));
  }

  h.push(felt('f_aar','Fremstillingsår','number','Fx 2014'));
  h.push(felt('f_wll','Største tilladte last i kg','number','Fx 8000'));

  if(!mange){
    h.push('<h2 class="afsnit">Forhold der afgør reglerne</h2>');
    h.push('<div class="vejl" style="font-size:13.5px">Svarene her afgør, om der skal '+
           'føres journal efter §72, og om der skal 10-års eftersyn efter §73. '+
           'Systemet regner det ud selv.</div>');
    h.push(vaelg('f_mek','Mekanisk drevet',[['Ja','Ja'],['Nej','Nej — håndkraft']],'Ja'));
    h.push(vaelg('f_fri','Løfter frithængende byrde',[['Ja','Ja'],['Nej','Nej — styret eller fastholdt']],'Ja'));
    h.push(vaelg('f_anv','Anvendes',[['Udendørs','Udendørs'],['Indendørs','Indendørs'],['Begge','Både ude og inde']],'Indendørs'));
    h.push(vaelg('f_fast','Opstilling',[['fast','Fast opstillet ét sted'],['skift','Skiftende opstillingssteder']],'fast'));
    h.push(vaelg('f_pers','Bruges til personløft',[['Nej','Nej'],['Ja','Ja']],'Nej'));
    h.push(vaelg('f_koer','Fast monteret på indregistreret lastbil',[['Nej','Nej'],['Ja','Ja']],'Nej'));
    h.push(felt('f_tm','Tonsmeter (kun lastbilkraner)','number','Fx 8'));
  }

  h.push('<h2 class="afsnit">Ejer og placering</h2>');
  h.push('<div id="ejerfelt">'+felt('f_ejer','Ejerens firma-ID','text','Fx C-002')+'</div>');
  h.push(steder.length
    ? vaelg('f_loc','Placering',[['','Vælg sted'],...steder.map(s=>[s.id,s.betegnelse])],'')
    : felt('f_locny','Placering','text','Fx Hal 3, stropreol A'));
  if(steder.length) h.push(felt('f_locny','…eller skriv et nyt sted','text','Fx Hal 3, stropreol A'));

  h.push('<button class="knap primaer" id="gem">'+(mange?'Opret emnerne':'Opret udstyret')+'</button>');
  const f=$('#formular');
  f.style.display='block';
  f.innerHTML=h.join('');
  f.scrollIntoView({behavior:'smooth',block:'start'});

  // Ejeren vælges fra en liste, ikke ved at huske et ID
  hent('api_ejere',[]).then(ejere=>{
    const boks=$('#ejerfelt');
    if(!boks) return;
    if(!ejere.length){
      boks.innerHTML='<div class="vejl" style="border-color:#4a3c1a;background:#241d0f;'+
        'color:#f0dcae;font-size:13px">Der er ingen ejere oprettet endnu. '+
        'Opret ejeren først under Mere.</div>';
      return;
    }
    boks.innerHTML=vaelg('f_ejer','Ejer af udstyret',
      [['','Vælg ejer'],...ejere.map(e=>[e.id,e.navn+(e.cvr?' · '+e.cvr:'')])],'');
  }).catch(()=>{});

  $('#gem').onclick=async()=>{
    const v=id=>$('#'+id)?.value?.trim()||'';
    const data={
      kategori, fabrikat:v('f_fabrikat'), type:v('f_type'),
      fabriksnr:v('f_fabriksnr'), fremstillingsaar:v('f_aar'), wll:v('f_wll'),
      ejerId:v('f_ejer'), kundeId:bruger.companyId
    };
    if(mange){
      data.mekaniskDrevet='Nej'; data.frithaengende='Nej';
      data.anvendelse='Begge'; data.fastOpstillet='Nej';
      data.skiftende='Ja'; data.personloeft='Nej'; data.paaKoeretoej='Nej';
      data.startnummer=v('f_start')||'1';
    }else{
      data.mekaniskDrevet=v('f_mek'); data.frithaengende=v('f_fri');
      data.anvendelse=v('f_anv');
      data.fastOpstillet=v('f_fast')==='fast'?'Ja':'Nej';
      data.skiftende=v('f_fast')==='skift'?'Ja':'Nej';
      data.personloeft=v('f_pers'); data.paaKoeretoej=v('f_koer');
      data.tonsmeter=v('f_tm');
    }
    if(v('f_locny')) data.lokationBetegnelse=v('f_locny');

    const knap=$('#gem'); knap.disabled=true; knap.textContent='Opretter …';
    try{
      const r=await kald('api_createEquipment',
        [data, mange?v('f_antal'):1, v('f_locny')?'':v('f_loc')]);
      toast(r.antal===1?'Udstyret er oprettet':r.antal+' emner oprettet');
      historik.length=0;
      if(r.antal===1) gå({navn:'maskine',id:r.foerste},false);
      else gå({navn:'liste'},false);
    }catch(e){ knap.disabled=false; knap.textContent=mange?'Opret emnerne':'Opret udstyret'; toast(e.message,true); }
  };
}
