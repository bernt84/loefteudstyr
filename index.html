async function visAdgang(userId){
  const erAdmin=bruger.rolle==='admin';
  const brugere=await hent('api_users',[]).catch(()=>[]);
  const mål=userId||bruger.id;
  const målBruger=brugere.find(b=>b.id===mål)||bruger;
  const målErAdmin=(målBruger.rolle||'')==='admin';

  const [famer,kat,ops]=await Promise.all([
    hent('api_categories',[]),
    målErAdmin?Promise.resolve([]):hent('api_userCategories',[mål]),
    hent('api_userScopes',[mål]).catch(()=>null)
  ]);

  const aktive={};
  kat.forEach(k=>{ if(k.aktiv==='Ja') aktive[k.kategori]=k; });
  sætTitel('Adgang',målBruger.navn+(målErAdmin?' · administrator':''));

  const h=[];
  if(erAdmin && brugere.length>1){
    h.push('<div class="chips" style="margin-bottom:14px">'+
      brugere.map(b=>'<button class="chip'+(b.id===mål?' valgt':'')+'" data-u="'+esc(b.id)+'">'+
        esc(b.navn)+'</button>').join('')+'</div>');
  }

  if(målErAdmin){
    h.push('<div class="vejl">Administratoren har adgang til alt og kan ikke begrænses.</div>');
    app.innerHTML=h.join('');
    document.querySelectorAll('[data-u]').forEach(b=>{ b.onclick=()=>visAdgang(b.dataset.u); });
    return;
  }

  /* ---- 1. hvilket udstyr ---- */
  h.push('<h2 class="afsnit">Hvilket udstyr</h2>');
  h.push('<div class="vejl" style="font-size:13px">Uden en kategori ser '+
    esc(målBruger.navn)+' bogstaveligt talt ingenting. Udstyret sendes ikke fra serveren.</div>');

  for(const f of famer){
    const antal=f.kategorier.filter(k=>aktive[k.navn]).length;
    h.push('<div style="font-size:12px;color:var(--faint);margin:12px 0 6px">'+
      esc(f.navn)+' · '+antal+' af '+f.kategorier.length+'</div>');
    for(const k of f.kategorier){
      const g=aktive[k.navn];
      h.push('<div class="hak'+(g?' klar':'')+'" data-kat="'+esc(k.navn)+'" '+
        'data-kid="'+esc(g?g.id:'')+'" style="cursor:pointer">'+
        '<span class="boks">✓</span><span class="txt">'+
          '<span>'+esc(k.navn)+'</span>'+
          '<span class="beskrivelse">'+(g?esc(g.kompetence):'Ikke godkendt')+'</span>'+
        '</span></div>');
    }
  }

  /* ---- 2. hvilke opgaver ---- */
  h.push('<h2 class="afsnit">Hvilke opgaver</h2>');
  if(!ops){
    h.push('<div class="vejl" style="border-color:#4a2521;background:#2d1917;color:#f0a49c;'+
      'font-size:13px">Opgaverne kunne ikke hentes. Serveren kører formentlig en ældre '+
      'version af koden — lav en ny version under Administrer implementeringer.</div>');
  }else if(ops.erFirmaAdmin){
    h.push('<div class="vejl" style="border-color:#39432b;background:#1e2410;color:#d8e39a;'+
      'font-size:13px">'+esc(målBruger.navn)+' er firmaadministrator og har automatisk '+
      'alle de opgaver, firmaet har fået lov til.</div>');
  }else if(!ops.firmaets.length){
    h.push('<div class="vejl" style="font-size:13px">Firmaet har ikke fået tilladelse til '+
      'nogen opgaver endnu. '+(bruger.rolle==='kunde'
        ?'Inspektøren giver tilladelserne.'
        :'Giv dem under firmaets side → Tilladelser.')+'</div>');
  }else{
    const tildelt={};
    ops.tildelte.forEach(t=>{ tildelt[t.scope]=t; });
    h.push('<div class="vejl" style="font-size:13px">Kun det, firmaet har fået lov til, '+
      'kan vælges her.</div>');
    for(const f of ops.firmaets){
      const t=tildelt[f.kode];
      h.push('<div class="hak'+(t?' klar':'')+'" data-s="'+esc(f.kode)+'" '+
        'data-sid="'+esc(t?t.id:'')+'" style="cursor:pointer">'+
        '<span class="boks">✓</span><span class="txt">'+
          '<span>'+esc(f.tekst)+'</span>'+
          '<span class="beskrivelse">'+(t?esc(t.kompetence):'Ikke tildelt')+'</span>'+
          (t&&t.gyldigTil?'<span class="beskrivelse" style="color:var(--amber)">Gyldig til '+
            dkDato(t.gyldigTil)+'</span>':'')+
        '</span></div>');
    }
  }
  app.innerHTML=h.join('');

  document.querySelectorAll('[data-u]').forEach(b=>{ b.onclick=()=>visAdgang(b.dataset.u); });

  const måRette = erAdmin || (bruger.rolle==='kunde' && bruger.firmaadmin==='Ja'
                              && mål!==bruger.id) || bruger.rolle==='inspektør';

  document.querySelectorAll('[data-kat]').forEach(el=>{
    if(!måRette){ el.style.cursor='default'; return; }
    el.onclick=async()=>{
      const k=el.dataset.kat, har=el.classList.contains('klar');
      try{
        if(har){
          const ja=await bekraeft('Fjern "'+k+'"?',
            målBruger.navn+' mister adgang til alt udstyr i kategorien.','Fjern',true);
          if(!ja) return;
          await kald('api_revokeCategory',[el.dataset.kid,'Fjernet manuelt']);
        }else{
          const komp=await spoergTekst('Godkend til "'+k+'"','Godkend');
          if(komp===null) return;
          if(!komp.trim()){ toast('Skriv kompetencegrundlaget.',true); return; }
          await kald('api_grantCategory',[mål,k,komp,'']);
        }
        visAdgang(mål);
      }catch(e){ toast(e.message,true); }
    };
  });

  document.querySelectorAll('[data-s]').forEach(el=>{
    if(!måRette||!ops||ops.erFirmaAdmin){ el.style.cursor='default'; return; }
    el.onclick=async()=>{
      const kode=el.dataset.s, har=el.classList.contains('klar');
      if(har){
        const ja=await bekraeft('Fjern opgaven?',
          målBruger.navn+' kan ikke længere udføre den.','Fjern',true);
        if(!ja) return;
        try{ await kald('api_revokeUserScope',[el.dataset.sid,'Fjernet manuelt']);
             visAdgang(mål); }catch(e){ toast(e.message,true); }
        return;
      }
      opgaveArk(mål,kode,(ops.firmaets.find(x=>x.kode===kode)||{}).tekst||kode,
                målBruger.navn);
    };
  });
}

async function visFane(famId){
  const d=await hent('api_familieListe',[famId]);
  faneTal=await hent('api_faneTal',[]);
  sætTitel(d.navn, d.antal+' emner'+(d.overskredet?' · '+d.overskredet+' overskredet':''));

  const h=[];
  if(d.kanOprette){
    h.push('<div class="fanetop">'+
      '<button class="primaer" onclick="gå({navn:\'opret\',id:\''+esc(famId)+'\'})">'+
      (d.listevisning?'Opret nye emner':'Opret ny')+'</button></div>');
  }

  if(!d.udstyr.length){
    h.push('<div class="tom"><p>Der er ikke registreret noget i '+esc(d.navn.toLowerCase())+' endnu.</p></div>');
    app.innerHTML=h.join('');
    tegnFaner();
    return;
  }

  if(d.listevisning){
    app.innerHTML=h.join('');
    await visGrupper(famId);
    tegnFaner();
    return;
  }

  h.push('<input class="sog" id="sog" placeholder="Søg fabriksnr., type eller fabrikat" autocomplete="off">');
  const grupper=[['overskredet','Overskredet'],['standset','Standset'],
                 ['snart','Inden for 3 måneder'],['ok','Gyldig'],['ukendt','Uden termin']];
  for(const [nøgle,navn] of grupper){
    const del=d.udstyr.filter(e=>e.varsel===nøgle);
    if(!del.length) continue;

function hentFil(base64,mime,filnavn){
  const bin=atob(base64), buf=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) buf[i]=bin.charCodeAt(i);
  const url=URL.createObjectURL(new Blob([buf],{type:mime||'application/octet-stream'}));
  const a=document.createElement('a');
  a.href=url; a.download=filnavn||'fil.pdf';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),4000);
}

async function danRapport(inspId){
  toast('Danner rapporten …');
  try{
    const r=await kald('api_generateReport',[inspId]);
    hentFil(r.base64,r.mime,r.filnavn);
    toast('Rapport '+r.rapportnr+' hentet');
    return r;
  }catch(e){ toast(e.message,true); return null; }
}

function qrTegn(canvas,tekst,px){
  let qr=null;
  for(let v=2;v<=20;v++){
    try{ const k=qrcode(v,'M'); k.addData(tekst); k.make(); qr=k; break; }catch(e){}
  }
  if(!qr) throw new Error('Teksten er for lang til en QR-kode.');
  const n=qr.getModuleCount(), q=4, s=px||6;
  canvas.width=canvas.height=(n+q*2)*s;
  const ctx=canvas.getContext('2d');
  ctx.fillStyle='#fff'; ctx.fillRect(0,0,canvas.width,canvas.height);
  ctx.fillStyle='#000';
  for(let r=0;r<n;r++) for(let c=0;c<n;c++) if(qr.isDark(r,c)) ctx.fillRect((c+q)*s,(r+q)*s,s,s);
  return canvas;
}

function findPosition(){
  return new Promise((ok,fejl)=>{
    if(!navigator.geolocation) return fejl(new Error('Telefonen giver ikke adgang til position.'));
    navigator.geolocation.getCurrentPosition(
      p=>ok({lat:p.coords.latitude,lng:p.coords.longitude,noejagtighed:Math.round(p.coords.accuracy)}),
      e=>fejl(new Error(e.code===1
        ? 'Du har afvist adgang til position. Slå det til i telefonens indstillinger.'
        : 'Kunne ikke finde din position. Prøv udendørs.')),
      {enableHighAccuracy:true,timeout:15000,maximumAge:30000});
  });
}

/* ================================================================== *
 * 32. Hele manualen, 10 sider ad gangen
 * ================================================================== */

let pdfLibKlar=null;
function hentPdfLib(){
  if(pdfLibKlar) return pdfLibKlar;
  pdfLibKlar=new Promise((ok,fejl)=>{
    if(window.PDFLib) return ok(window.PDFLib);
    const s=document.createElement('script');
    s.src='./pdf-lib.min.js';
    s.onload=()=>window.PDFLib?ok(window.PDFLib):fejl(new Error('pdf-lib kunne ikke indlæses.'));
    s.onerror=()=>fejl(new Error('pdf-lib.min.js blev ikke fundet ved siden af index.html.'));
    document.head.appendChild(s);
  });
  return pdfLibKlar;
}

/**
 * Deler PDF'en i stykker à 10 sider i browseren og sender dem ét ad
 * gangen. Drive læser kun 10 sider pr. fil, så det er den eneste vej
 * til resten af manualen.
 */
async function laesHeleManualen(equipmentId,fil,statusEl){
  const PDFLib=await hentPdfLib();
  const bytes=new Uint8Array(await fil.arrayBuffer());
  const kilde=await PDFLib.PDFDocument.load(bytes,{ignoreEncryption:true});
  const sider=kilde.getPageCount();
  const bidder=Math.ceil(sider/10);

  const alle=[]; let tegn=0;
  for(let i=0;i<bidder;i++){
    const fra=i*10, til=Math.min(fra+10,sider);
    statusEl.textContent='Læser side '+(fra+1)+'–'+til+' af '+sider+' …';
    const del=await PDFLib.PDFDocument.create();
    const s2=await del.copyPages(kilde,Array.from({length:til-fra},(_,j)=>fra+j));
    s2.forEach(p=>del.addPage(p));
    const b64=btoa(String.fromCharCode(...new Uint8Array(await del.save())));
    try{
      const r=await kald('api_ocrChunk',[equipmentId,b64,fra+1,'sider_'+(fra+1)+'-'+til+'.pdf']);
      tegn+=r.tegn; alle.push(...r.forslag);
    }catch(e){
      statusEl.textContent='';
      throw new Error('Fejl ved side '+(fra+1)+'–'+til+': '+e.message);
    }
  }
  statusEl.textContent='';

  // fjern gengangere på tværs af bidderne
  const set={}, unikke=[];
  for(const f of alle){
    const n=f.felt+'|'+f.vaerdi+'|'+f.enhed+'|'+f.kildetekst.slice(0,60);
    if(set[n]) continue; set[n]=true; unikke.push(f);
  }
  return {fundet:unikke.length,tegn,sider,bidder,forslag:unikke.slice(0,120),
    advarsel:'Hele manualen på '+sider+' sider er læst i '+bidder+' omgange. '+
      'Genkendelsen fejler stadig på tabeller og dårlige scanninger — '+
      'bekræft kun det du selv kan se er rigtigt i kildeteksten.'};
}

    h.push('<div class="kort" style="border-left:4px solid var(--teal)">'+
      '<div style="font-weight:700;color:var(--teal)">Lukket</div>'+
      (f.metode?'<div style="font-size:15px;font-weight:600;margin-top:6px">'+
        esc(f.metode)+'</div>':'')+

      '<div style="font-weight:600;color:var(--lime)">Ejeren melder det bragt i orden</div>'+
      '<div style="font-size:13.5px;color:#cfd8c8;margin-top:6px">'+esc(f.dokumentation||'')+'</div>'+
      '<div style="font-size:12.5px;color:var(--dim);margin-top:6px">'+
        esc(f.udbedretAf||'')+' · '+dkDato(f.udbedretDato)+'</div>'+
      '<div style="font-size:12.5px;color:var(--amber);margin-top:8px">Oplysning fra ejeren. '+
        'Forholdet er stadig åbent, indtil du har set efter.</div></div>');

    h.push('<button class="knap primaer" id="f_verificer">Lukket — jeg har kontrolleret det</button>');
    h.push('<div class="vejl" style="font-size:13px">Du skal angive <b>hvordan</b> forholdet '+
      'blev bragt i orden — udskiftet, repareret, justeret. Uddybningen er valgfri og '+
      'kræves kun ved "Andet". Begge dele kommer med i rapporten og i journalen.</div>');
    if(f.alvorlighed==='Kritisk'&&f.erUdstedt){
      h.push('<div class="vejl" style="border-color:#4a2521;background:#2d1917;color:#f0a49c;'+
        'font-size:13px">Forholdet er kritisk og står i rapport '+esc(f.rapportnr)+
        '. En udstedt rapport rettes ikke — luk det med et verificerende eftersyn '+
        'eller et tillæg, og angiv nummeret.</div>');
    }
    if(f.udstyrStatus==='Standset'){
      h.push('<div class="vejl" style="font-size:13px">Udstyret er standset. Er der ikke '+
        'flere åbne kritiske forhold, når dette lukkes, sættes det aktivt igen.</div>');
    }
  }else if(f.maaMeldeUdbedret && f.status==='Åben'){
    h.push('<button class="knap primaer" id="f_udbedret">Meld udbedret</button>');
    h.push('<div class="vejl" style="font-size:13px">Beskriv hvad I har gjort. '+
      'Forholdet lukkes først, når inspektøren har kontrolleret det.</div>');
  }

      'font-weight:500">Ret alvorlighed, frist eller beskrivelse</button>');
    if(f.maaAnnulleres){
      h.push('<button class="knap fare" id="f_annul" style="min-height:44px;'+
        'font-size:13.5px;font-weight:500">Svaret var forkert — annullér forholdet</button>');

        'udbedret. Brug den kun, når forholdet aldrig burde have været konstateret. '+
        'Punktet nulstilles, så du kan svare på ny, og begrundelsen skrives i loggen.</div>');
    }

  app.innerHTML=h.join('');

  const ud=$('#f_udbedret');
  if(ud) ud.onclick=async()=>{
    const t=await spoergTekst('Hvad har I gjort?','Meld udbedret');

    const g=await spoergTekst('Hvorfor annulleres forholdet?','Annullér forholdet');
    if(g===null) return;
    if(!g.trim()){ toast('Skriv hvorfor. Det skrives i loggen.',true); return; }
    try{
      const r=await kald('api_annulFinding',[findingId,g]);
      toast(r.udstyrGenaabnet?'Annulleret · udstyret er aktivt igen':'Forholdet er annulleret');
      historik.length?gå(historik.pop(),false):gå({navn:'mere'},false);
    }catch(e){ toast(e.message,true); }
  };

  const ret=$('#f_ret');
  if(ret) ret.onclick=async()=>{
    const m=document.getElementById('modal');
    m.innerHTML='<div class="ark"><h3>Ret forholdet</h3>'+
      '<label style="display:block;margin-bottom:11px">'+
        '<span style="display:block;font-size:12.5px;color:var(--dim);margin-bottom:4px">'+
        'Beskrivelse</span><textarea id="fr_besk">'+esc(f.beskrivelse)+'</textarea></label>'+
      vaelg('fr_alv','Alvorlighed',[['Kritisk','Kritisk — anvendelse standses'],
        ['Væsentlig','Væsentlig — frist'],['Bemærkning','Bemærkning']],f.alvorlighed)+
      felt('fr_frist','Frist','text','Fx 2026-10-15 eller Straks',f.frist)+
      '<button class="knap primaer" id="mja">Gem</button>'+
      '<button class="knap" id="mnej">Fortryd</button></div>';
    m.className='vis';
    m.querySelector('#mnej').onclick=()=>{ m.className=''; m.innerHTML=''; };
    m.querySelector('#mja').onclick=async()=>{
      const alv=m.querySelector('#fr_alv').value, fr=m.querySelector('#fr_frist').value.trim();
      const besk=m.querySelector('#fr_besk').value.trim();
      m.className=''; m.innerHTML='';
      if(!besk){ toast('Beskrivelsen må ikke være tom.',true); return; }
      try{ await kald('api_updateFinding',[findingId,{alvorlighed:alv,frist:fr,beskrivelse:besk}]);
           toast('Rettet'); visFejl(findingId); }
      catch(e){ toast(e.message,true); }
    };
  };
}

/** Ét ark til lukningen: metode, notat og eventuel henvisning. */
function lukForhold(f){
  const kritisk = f.alvorlighed==='Kritisk' && f.erUdstedt;
  const m=document.getElementById('modal');
  m.innerHTML='<div class="ark" style="max-height:86vh;overflow-y:auto">'+
    '<h3>Luk forholdet</h3>'+
    '<p>Vælg hvordan det blev bragt i orden. Uddybningen er valgfri — den kræves kun ved "Andet".</p>'+
    '<div id="lfejl"></div>'+
    '<div class="chips" id="lm">'+(f.metoder||[]).map(x=>
      '<button class="chip" data-m="'+esc(x)+'">'+esc(x)+'</button>').join('')+'</div>'+
    '<textarea id="lnote" placeholder="Uddybning — valgfri. Fx: Wire udskiftet med 16 mm 6x36WS, certifikat modtaget, funktionsafprøvet med last."></textarea>'+
    (kritisk
      ? '<div class="vejl" style="border-color:#4a2521;background:#2d1917;color:#f0a49c;'+
        'font-size:13px">Forholdet er kritisk og står i rapport '+esc(f.rapportnr||'')+
        '. Nummeret på det verificerende eftersyn eller tillæg <b>skal</b> udfyldes, '+
        'før det kan lukkes.</div>'+
        felt('lhenv','Verificerende eftersyn eller tillæg (påkrævet)','text',
             'Fx TILLÆG 2026-0031-01')
      : '')+
    '<button class="knap primaer" id="mja">Luk forholdet</button>'+
    '<button class="knap" id="mnej">Fortryd</button></div>';
  m.className='vis';

  const vis=t=>{
    const e=m.querySelector('#lfejl');
    e.innerHTML=t?'<div class="arkfejl">'+esc(t)+'</div>':'';
    if(t) e.scrollIntoView({behavior:'smooth',block:'nearest'});
  };

  let metode=null;
  m.querySelectorAll('[data-m]').forEach(b=>{
    b.onclick=()=>{
      m.querySelectorAll('[data-m]').forEach(x=>x.classList.remove('valgt'));
      b.classList.add('valgt'); metode=b.dataset.m;
    };
  });
  m.querySelector('#mnej').onclick=()=>{ m.className=''; m.innerHTML=''; };
  m.querySelector('#mja').onclick=async()=>{
    const note=m.querySelector('#lnote').value.trim();
    const henv=kritisk?m.querySelector('#lhenv').value.trim():'';
    if(!metode){ vis('Vælg hvordan forholdet blev bragt i orden.'); return; }
    if(metode==='Andet'&&!note){ vis('Skriv hvad der blev gjort, når du vælger "Andet".'); return; }
    if(kritisk&&!henv){
      vis('Forholdet er kritisk og står i en udstedt rapport. Angiv nummeret på det '+
          'verificerende eftersyn eller tillæg.');
      m.querySelector('#lhenv')?.focus();
      return;
    }
    m.className=''; m.innerHTML='';
    try{
      const r=await kald('api_verifyFinding',[f.id,note,henv,metode]);
      toast(r.udstyrGenaabnet?'Lukket · udstyret er aktivt igen':'Forholdet er lukket');
      visFejl(f.id);
    }catch(e){ m.className='vis'; vis(e.message); }
  };
}

async function visTilladelser(companyId){
  const [katalog,mine,alle]=await Promise.all([
    hent('api_scopeCatalog',[]),
    hent('api_scopes',[companyId]),
    hent('api_companies',[])
  ]);
  const c=alle.find(x=>x.id===companyId);
  const aktive={};
  mine.forEach(s=>{ if(s.aktiv==='Ja') aktive[s.scope]=s; });
  sætTitel('Tilladelser',(c?c.navn:companyId)+' · '+Object.keys(aktive).length+' givet');

  const h=['<div class="vejl">Her bestemmer du, <b>hvad firmaet må</b>. Hvem hos '+
    'kunden der konkret udfører opgaven, bestemmer deres egen firmaadministrator '+
    'bagefter — det er hans folk, og hans vurdering af dem.<br><br>'+
    'Giver du dem lov til at efterse løftetilbehør, er det deres mand, der er '+
    'sagkyndig efter §25 — ikke dig.</div>'];

  for(const k of katalog){
    const s=aktive[k.kode];
    h.push('<div class="hak'+(s?' klar':'')+'" data-scope="'+esc(k.kode)+'" '+
      'data-id="'+esc(s?s.id:'')+'" style="cursor:pointer">'+
      '<span class="boks">✓</span><span class="txt">'+
        '<span>'+esc(k.tekst)+'</span>'+
        '<span class="beskrivelse">'+(s?'Firmaet har lov':'Ikke givet')+
          (s&&s.gyldigTil?' · gyldig til '+dkDato(s.gyldigTil):'')+'</span>'+
      '</span></div>');
  }
  app.innerHTML=h.join('');

  document.querySelectorAll('[data-scope]').forEach(el=>{
    el.onclick=async()=>{
      const kode=el.dataset.scope, har=el.classList.contains('klar');
      if(har){
        const ja=await bekraeft('Tilbagekald tilladelsen?',
          'Firmaet kan ikke længere udføre opgaven, og deres folks tildelinger '+
          'holder op med at virke. Historikken bevares.','Tilbagekald',true);
        if(!ja) return;
        try{ await kald('api_revokeScope',[el.dataset.id,'Tilbagekaldt manuelt']);
             toast('Tilbagekaldt'); visTilladelser(companyId); }
        catch(e){ toast(e.message,true); }
      }else{
        try{ await kald('api_grantScope',[companyId,kode,{}]);
             toast('Tilladelsen er givet'); visTilladelser(companyId); }
        catch(e){ toast(e.message,true); }
      }
    };
  });
}

/* ================================================================== *
 * Installation på hjemmeskærmen
 *
 * Chrome og Android giver os "beforeinstallprompt" og kan installere
 * med ét tryk. iOS/Safari har ingen API — der kan vi kun vise, hvor
 * knappen sidder.
 * ================================================================== */

let installEvent=null;
const erInstalleret=()=>matchMedia('(display-mode: standalone)').matches
  || navigator.standalone===true;
const erIOS=()=>/iPad|iPhone|iPod/.test(navigator.userAgent)
  || (navigator.platform==='MacIntel' && navigator.maxTouchPoints>1);

addEventListener('beforeinstallprompt',e=>{
  e.preventDefault();
  installEvent=e;
  opdaterInstallKnap();
});
addEventListener('appinstalled',()=>{
  installEvent=null;
  toast('Appen er installeret');
  opdaterInstallKnap();
});

function kanInstallere(){
  return !erInstalleret() && (installEvent || erIOS());
}

function opdaterInstallKnap(){
  document.querySelectorAll('[data-install]').forEach(b=>{
    b.style.display=kanInstallere()?'':'none';
  });
}

async function installerApp(){
  if(erInstalleret()){ toast('Appen er allerede installeret'); return; }

  if(installEvent){
    installEvent.prompt();
    const svar=await installEvent.userChoice;
    installEvent=null;
    opdaterInstallKnap();
    if(svar.outcome!=='accepted') toast('Installationen blev afbrudt');
    return;
  }

  // iOS og alt andet: vis hvor knappen sidder
  const m=document.getElementById('modal');
  const ios=erIOS();
  m.innerHTML='<div class="ark" style="max-height:86vh;overflow-y:auto">'+
    '<h3>Læg appen på hjemmeskærmen</h3>'+
    '<p>Så åbner den som en app, og svar kan gives uden dækning.</p>'+
    (ios
      ? '<div class="kort" style="font-size:14.5px">'+
        '<div style="font-weight:600;margin-bottom:8px">På iPhone og iPad</div>'+
        '<div style="color:#cfd8c8">1 · Tryk på <b>Del</b>-knappen i bunden af Safari '+
        '— firkanten med pilen op.<br><br>'+
        '2 · Rul ned og vælg <b>Føj til hjemmeskærm</b>.<br><br>'+
        '3 · Tryk <b>Tilføj</b> øverst til højre.</div>'+
        '<div style="font-size:12.5px;color:var(--amber);margin-top:10px">'+
        'Det virker kun i Safari. Bruger du Chrome på iPhone, så åbn siden i Safari først.'+
        '</div></div>'
      : '<div class="kort" style="font-size:14.5px">'+
        '<div style="font-weight:600;margin-bottom:8px">På Android</div>'+
        '<div style="color:#cfd8c8">1 · Tryk på menuen med de tre prikker øverst til højre.'+
        '<br><br>2 · Vælg <b>Installer app</b> eller <b>Føj til startskærm</b>.</div></div>')+
    '<button class="knap primaer" id="mja">Luk</button></div>';
  m.className='vis';
  m.querySelector('#mja').onclick=()=>{ m.className=''; m.innerHTML=''; };
  m.onclick=e=>{ if(e.target===m){ m.className=''; m.innerHTML=''; } };
}

/* ================================================================== *
 * 14. Start
 * ================================================================== */

(async function start(){
  if('serviceWorker' in navigator){
    try{ await navigator.serviceWorker.register('./sw.js'); }catch(e){}
  }
  await visNet();
  idToken=await dbHent(CFG,'idToken');
  sessionToken=await dbHent(CFG,'sessionToken');
  bruger =await dbHent(CFG,'bruger');
  if((idToken||sessionToken) && bruger){
    tegn();
    // Bekræft at tokenet stadig gælder. Fejler det, sender logUd
    // brugeren til login uden at miste køen.
    kald('api_me').then(d=>{ bruger=d.bruger; dbSæt(CFG,'bruger',bruger); })
                  .catch(()=>{ if(navigator.onLine) logUd(true); });
    bedOmSynk();
  }else{
    tegn();
  }
})();
</script>
